name: SS Learning Aids Browser E2E
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/ss-progress.js'
      - 'assets/ss-applications.js'
      - 'assets/ss-learning-aids.js'
      - 'assets/ss-learning-path.js'
      - 'index.html'
      - 'tests/learning-aids-qa.mjs'
      - 'tests/ch7-header-nav-e2e.mjs'
      - 'package.json'
      - '.github/workflows/learning-aids-qa.yml'
jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Run desktop and mobile Chromium E2E tests
        run: npm run qa:learning
      - name: Verify Chapter 7 header and seven direct-navigation labs
        run: node tests/ch7-header-nav-e2e.mjs
      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ss-learning-aids-e2e
          path: |
            qa-learning-output/
            qa-ch7/
          if-no-files-found: warn
          retention-days: 14
