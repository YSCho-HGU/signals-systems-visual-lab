name: Neutral Dark Theme and S&S Lab QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/els-theme-v2.css'
      - 'assets/els-theme-v2.js'
      - 'assets/ss-compact-lab.css'
      - 'tests/ss-theme-qa.mjs'
      - 'tests/ss-theme-qa.mjs'
      - '.github/workflows/ss-theme-qa.yml'
jobs:
  neutral-dark-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Verify theme persistence and in-place lab theming
        run: C_JOURNEY_BROWSER=1 node tests/ss-theme-qa.mjs
      - name: Upload theme QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ss-neutral-dark-theme-qa
          path: qa-output/
          if-no-files-found: warn
          retention-days: 14
