name: Chapters 1-8 Continuity & Design Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'chapter*.html'
      - 'index.html'
      - 'assets/ss-foundations-standard.*'
      - 'assets/ss-learning-bridges.*'
      - 'assets/ss-common-header.js'
      - 'tests/chapter-continuity-qa.mjs'
      - '.github/workflows/chapter-continuity-audit.yml'

concurrency:
  group: continuity-audit-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  continuity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Test standalone chapters and bridges
        continue-on-error: true
        run: node tests/chapter-continuity-qa.mjs
      - name: Publish audit results
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs'),path='qa-continuity/latest.json';
            const data=fs.existsSync('qa-continuity/results.json')
              ?JSON.parse(fs.readFileSync('qa-continuity/results.json','utf8'))
              :{status:'NOT_RUN',failures:[{id:'runner',detail:'No test results'}]};
            data.sourceSha=context.sha;data.runId=context.runId;data.generatedAt=new Date().toISOString();
            const {owner,repo}=context.repo;
            const branch=await github.rest.repos.getBranch({owner,repo,branch:'main'});
            if(branch.data.commit.sha!==context.sha){
              core.info('Skip stale QA publication: '+context.sha+' is not main '+branch.data.commit.sha);
              return;
            }
            let sha;
            try{const old=await github.rest.repos.getContent({owner,repo,path,ref:'main'});sha=old.data.sha}
            catch(e){if(e.status!==404)throw e}
            await github.rest.repos.createOrUpdateFileContents({
             owner,repo,path,branch:'main',sha,content:Buffer.from(JSON.stringify(data,null,2)+'\n').toString('base64'),
             message:'chore(qa): Continuity audit '+context.runId+' [skip ci]'
            });
      - name: Upload screenshots and report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: continuity-audit
          path: qa-continuity/
          if-no-files-found: warn
      - name: Enforce quality gate
        if: always()
        run: |
          node -e "const fs=require('fs');const p='qa-continuity/results.json';if(!fs.existsSync(p)||JSON.parse(fs.readFileSync(p)).status!=='PASS')process.exit(1)"
