name: SS Navigation and Math UI Visual QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "assets/ss-common-header.css"
      - "assets/ss-sidebar-layout.css"
      - "assets/ss-chapter5-layout-standard.css"
      - "assets/ss-chapter5-internal-rhythm.css"
      - "assets/ss-graph-math.js"
      - "assets/ss-graph-math.css"
      - "tests/ss-graph-math-visual-e2e.mjs"
      - "tests/ss-all-lab-graph-audit.mjs"
      - "tests/ss-graph-geometry-e2e.mjs"
      - "tests/ss-independent-math-e2e.mjs"
      - "assets/ss-ch1-native-navigation.css"
      - "assets/ss-foundations-standard.css"
      - "assets/ss-overview-standard.css"
      - "assets/ss-overview-standard.js"
      - "assets/ss-ch7-standalone.js"
      - "assets/ss-ch8-native.js"
      - "chapter*.html"
      - "index.html"
      - "tests/ss-navigation*.mjs"
      - "package.json"
      - ".github/workflows/ss-navigation-visual.yml"
permissions:
  contents: read
jobs:
  navigation-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Shared header and sidebar contract
        run: npm run qa:navigation
      - name: 8 chapters, dark theme, responsive layout, overview and map
        run: npm run qa:navigation:visual
      - name: Canvas and SVG axis formula regression
        run: npm run qa:graph-math
      - name: Full-curriculum graph and formula presentation audit
        run: npm run qa:graph-all-labs
      - name: Axis label geometry and clipping audit
        run: npm run qa:graph-geometry
      - name: Independent mathematical reference verification
        run: npm run qa:math-independent
      - name: Upload visual audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ss-navigation-visual-evidence
          path: |
            qa-navigation/
            qa-graph-math/
            qa-graph-content/
            qa-graph-geometry/
            qa-math-reference/
          if-no-files-found: ignore
