name: Visual Lab Accessibility and Regression Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'chapter6.html'
      - 'chapter7.html'
      - 'chapter8.html'
      - 'chapter5.html'
      - 'assets/**'
      - 'tests/**'
      - 'docs/qa/**'
      - 'tests/qa-dashboard-data.mjs'
      - 'package.json'
      - '.github/workflows/visual-audit.yml'

concurrency:
  group: ss-qa-main
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: G0 - Validate source, catalog and storage contracts
        run: |
          mkdir -p qa-standard
          if node tests/qa-contracts.mjs; then echo PASS > qa-standard/G0.status; else echo FAIL > qa-standard/G0.status; fi

      - name: Install browser tooling
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: G1 - Verify independent Chapter 6 sampling mathematics
        run: |
          if node tests/ch6-sampling-foundations.mjs; then echo PASS > qa-standard/G1.status; else echo FAIL > qa-standard/G1.status; fi

      - name: G2 - Test native Chapters 5 and 6 across three Chromium viewports
        run: |
          status=0
          node tests/ch6-viewport-e2e.mjs || status=1
          node tests/ch5-viewport-e2e.mjs || status=1
          if [ "$status" -eq 0 ]; then echo PASS > qa-standard/G2.status; else echo FAIL > qa-standard/G2.status; fi

      - name: G2c - Test native Chapter 7 layout, themes and seven lessons
        run: |
          if node tests/ch7-viewport-e2e.mjs; then echo PASS > qa-standard/G2c.status; else echo FAIL > qa-standard/G2c.status; fi

      - name: Chapter 5 - Verify inline equations and guided derivations across eight labs
        run: |
          if node tests/ch5-prose-math-qa.mjs; then echo PASS > qa-standard/ch5-math.status; else echo FAIL > qa-standard/ch5-math.status; fi

      - name: Chapter 8 - Audit all key equations and guided mathematics
        run: |
          if node tests/ch8-math-qa.mjs; then echo PASS > qa-standard/CH8_MATH.status; else echo FAIL > qa-standard/CH8_MATH.status; fi

      - name: G3 - Verify shared theme and in-place language controls
        run: |
          if C_JOURNEY_BROWSER=1 node tests/ss-theme-qa.mjs; then echo PASS > qa-standard/G3.status; else echo FAIL > qa-standard/G3.status; fi

      - name: G2b - Verify five palettes in Chromium and Edge
        run: |
          status=0
          node tests/ss-ch5-ch6-standard-qa.mjs || status=1
          if npx playwright install msedge; then
            SS_BROWSER_CHANNEL=msedge node tests/ss-ch5-ch6-standard-qa.mjs || status=1
          else
            echo "Microsoft Edge installation failed; browser verification incomplete"
            status=1
          fi
          if [ "$status" -eq 0 ]; then echo PASS > qa-standard/G2b.status; else echo FAIL > qa-standard/G2b.status; fi

      - name: G4 - Test progress, prediction and sonification learning aids
        run: |
          if npm run qa:learning; then echo PASS > qa-standard/G4.status; else echo FAIL > qa-standard/G4.status; fi

      - name: G5 - Protect all 62 progress IDs and stored preferences
        run: |
          if node tests/phase0-ss-baseline.mjs; then echo PASS > qa-standard/G5.status; else echo FAIL > qa-standard/G5.status; fi
          node tests/phase0-storage-scan.mjs

      - name: G6 - Capture 248 screenshots with theme and overflow checks
        run: |
          if npm run qa:visual; then echo PASS > qa-standard/G6.status; else echo FAIL > qa-standard/G6.status; fi

      - name: G7 - Check all 248 evidence records and body text contrast
        run: |
          if [ -f qa-output/results.json ] && node tests/quality-gates.mjs; then echo PASS > qa-standard/G7.status; else echo FAIL > qa-standard/G7.status; fi

      - name: Summarize all gate results; fail only for real blocking issues
        if: always()
        run: node tests/qa-summary.mjs

      - name: Export per-chapter status snapshot for the Studio administrator
        if: always()
        run: node tests/qa-dashboard-data.mjs

      - name: Publish latest QA results to public repository data
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs=require('fs');
            const path='qa-dashboard/latest.json';
            if(!fs.existsSync(path))throw Error('QA snapshot generation failed');
            const {owner,repo}=context.repo;
            const content=Buffer.from(fs.readFileSync(path,'utf8')).toString('base64');
            let sha;
            try{
              const current=await github.rest.repos.getContent({owner,repo,path,ref:'main'});
              if(Array.isArray(current.data))throw Error('QA snapshot is a directory');
              sha=current.data.sha;
            }catch(error){
              if(error.status!==404)throw error;
            }
            // Snapshot commits use GITHUB_TOKEN, do not trigger another QA run.
            const result=await github.rest.repos.createOrUpdateFileContents({
              owner,repo,path,branch:'main',sha,content,
              message:'chore(qa): publish chapter status from run '+context.runId+' [skip ci]'
            });
            core.info('Published snapshot for run '+context.runId+' at '+result.data.commit.sha);

      - name: Upload quality reports and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ss-qa-standard-62-labs
          path: |
            qa-standard/
            qa-dashboard/
            qa-output/
            qa-ch6-viewport/
            qa-ch5/
            qa-ch5-ch6-standard/
            qa-ch5-math/
            qa-ch8-math/
            qa-learning-output/
            qa-phase0/
          if-no-files-found: warn
          retention-days: 14
