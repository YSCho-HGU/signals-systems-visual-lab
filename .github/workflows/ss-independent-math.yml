name: SS Independent Math Reference QA
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "chapter*.html"
      - "tests/ss-independent-math-e2e.mjs"
      - ".github/workflows/ss-independent-math.yml"
permissions:
  contents: read
jobs:
  independent-math:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Verify analytical equations against independent reference values
        run: npm run qa:math-independent
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ss-independent-math-report
          path: qa-math-reference/
          if-no-files-found: ignore
