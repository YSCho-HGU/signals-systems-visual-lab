/* Guided Derivation: synchronized equation reveal and graph-reading panels */
.derivation-panel,.reading-panel{background:#fff;border:1px solid #dce6ec;border-radius:16px;box-shadow:0 5px 19px #1e455407;padding:20px;min-width:0}
.guide-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.guide-head h3,.reading-panel h3{font-size:18px;line-height:1.35;margin:5px 0 8px;color:#173046}
.guide-head p{font-size:12px;color:#526a7c;margin:0 0 14px}
.progress-badge{background:#e6f4f5;color:#086c76;font:700 12px system-ui,sans-serif;padding:6px 11px;border-radius:18px;white-space:nowrap}
.guide-track{height:5px;background:#dcebee;border-radius:8px;margin:4px 0 14px;overflow:hidden}
.guide-track>div{height:100%;background:#0e8491;border-radius:8px;transition:width .38s ease}
.guide-steps{display:grid;gap:10px}
.deriv-step{border:1px solid #dfe9ee;border-radius:12px;padding:12px 14px;background:#fcfdfd;min-width:0}
.deriv-step.guide-enter{animation:guideReveal .58s cubic-bezier(.18,.65,.27,1) both;border-color:#75c5c7;background:#f2faf9}
@keyframes guideReveal{from{opacity:0;transform:translateY(19px);filter:blur(2px)}to{opacity:1;transform:translateY(0);filter:blur(0)}}
.deriv-top{display:flex;align-items:center;gap:9px;font-size:13px;color:#173046;min-width:0}
.step-index{display:inline-flex;align-items:center;justify-content:center;background:#e3f2f3;color:#087680;border-radius:50%;height:24px;width:24px;min-width:24px;font-size:12px;font-weight:800}
.deriv-math{margin:9px 0;color:#174b5d;font-family:Cambria,'Cambria Math','Times New Roman',serif;font-size:17px;line-height:1.7;overflow-wrap:anywhere;white-space:normal;overflow-x:auto;padding:6px 10px;background:#eef7f8;border-left:3px solid #0e8491;border-radius:6px}
.deriv-step p{font-size:13px;color:#486272;margin:8px 0 0;line-height:1.68}
.guide-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}
.guide-actions button{background:#fff;color:#20546a;border:1px solid #c8dce5;border-radius:9px;padding:9px 12px;font:700 12px system-ui,'Malgun Gothic',sans-serif;cursor:pointer}
.guide-actions button:hover{background:#edf8f8;border-color:#0e8491}
.guide-actions button:disabled{opacity:.4;cursor:not-allowed}
.guide-actions button.primary{color:#fff;background:#0e8491;border-color:#0e8491}
.guide-actions button:focus-visible{outline:3px solid #e7ac3f;outline-offset:2px}
.reading-panel{background:#fafdfd}
.reading-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.reading-note{padding:11px 12px;border:1px solid #dce9eb;border-radius:12px;background:#fff}
.plot-number{font-size:10px;letter-spacing:.09em;color:#0e8491;font-weight:800;display:block;margin-bottom:5px}
.reading-note strong{display:block;color:#173046;font-size:13px}
.reading-note p{font-size:12px;line-height:1.62;margin:6px 0 0;color:#344f60}
.reading-note .ko-explain{color:#617b8a}
.guide-check{font-size:13px;margin:12px 0 0;color:#395b68;border-top:1px solid #dce9eb;padding-top:11px}
@media(max-width:750px){.derivation-panel,.reading-panel{padding:15px}.deriv-math{font-size:15px}.reading-grid{grid-template-columns:1fr}.guide-actions button{flex:1 1 auto}}
@media(prefers-reduced-motion:reduce){.deriv-step.guide-enter{animation:none}.guide-track>div{transition:none}}

.overlabel{font-size:10px;letter-spacing:.1em;font-weight:800;color:#0e8491;text-transform:uppercase}

 {id:'periodic',short:'01',title:'Digital Frequency & 2π Periodicity',en:'Digital Frequency and DTFT Periodicity',subtitle:'Begin with Ω=2πf/fₛ and integer sample index n. Predict why Ω and Ω+2π describe the same DT sequence, then use the sampled analog cosines as supporting evidence. Chapter 7 examines the physical aliasing consequence.',formula:'\u03a9 = 2\u03c0f / f<sub>s</sub> &nbsp; | &nbsp; X(e<sup>j(\u03a9+2\u03c0)</sup>) = X(e<sup>j\u03a9</sup>)',controls:[{key:'fs',name:'Sampling rate f_s',type:'range',min:100,max:200,step:20,unit:' Hz'},{key:'f',name:'Analog tone f',type:'range',min:5,max:45,step:1,unit:' Hz'},{key:'ns',name:'Visible sample count N',type:'range',min:12,max:32,step:2,unit:' samples'}],plots:[['Analog Waves and Their Samples','Two different analog frequencies; dots at integer n are identical'],['DTFT of N Samples · 2π-Periodic','Finite-record magnitude |X_N(e^{jΩ})|/N from exactly the N visible samples']],metric:['Digital frequency Ω/π','Other analog tone f₂','Max sample difference'],q:'Why is X(e^{j(Ω+2π)})=X(e^{jΩ}) for any discrete-time sequence? How does the cosine sample comparison illustrate this?',a:'For integer n, e^{−j(Ω+2π)n}=e^{−jΩn}e^{−j2πn}=e^{−jΩn}. Thus DT frequency is 2π-periodic. For real cosines, f and fₛ−f also produce identical samples due to cosine even symmetry. Chapter 7 uses this to study aliasing and recovery limits.'},

function esc(s){return String(s).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;')}
function clean(x,n=3){return (Math.abs(x)<1e-10?0:x).toFixed(n)}
function mod(x,m){return ((x%m)+m)%m}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function cis(t){return [Math.cos(t),Math.sin(t)]}
function mag(z){return Math.hypot(z[0],z[1])}
function maH(m,w){let re=0,im=0;for(let k=0;k<m;k++){re+=Math.cos(w*k)/m;im-=Math.sin(w*k)/m}return [re,im]}
function spectrum(sig,w){let re=0,im=0;for(let i=0;i<sig.length;i++){const [n,x]=sig[i];re+=x*Math.cos(w*n);im-=x*Math.sin(w*n)}return [re,im]}
function niceStep(span,target=5){
  const raw=Math.max(1e-12,Math.abs(span)/target);
  const exp=Math.floor(Math.log10(raw)),unit=Math.pow(10,exp);
  const candidates=[1,2,2.5,5,10];
  let step=(candidates.find(v=>v*unit>=raw-1e-12)||10)*unit;
  // Chapter 5 Rev3 axis convention: favor integer-valued steps for wider ranges.
  if(span>=3.5&&step<1)step=1;
  return step;
}
function tickLabel(v,step){
  if(Math.abs(v)<Math.max(step*1e-7,1e-10))return '0';

  return Number(v.toFixed(decimals)).toString();
}

function drawPeriodic(s){
 const fs=s.fs,f=s.f,other=fs-f,w=TAU*f/fs,N=s.ns,nmax=N-1;
 const samples=[],analog1=[],analog2=[];let maxDiff=0;
 for(let n=0;n<N;n++){
  const a=Math.cos(TAU*f*n/fs),b=Math.cos(TAU*other*n/fs);
  samples.push([n,a]);maxDiff=Math.max(maxDiff,Math.abs(a-b));
 }
 // Horizontal coordinate t/T_s is continuous; black stems appear at integer sample indices.
 const subdivisions=24;
 for(let k=0;k<=nmax*subdivisions;k++){
  const nt=k/subdivisions;
  analog1.push([nt,Math.cos(TAU*f*nt/fs)]);
  analog2.push([nt,Math.cos(TAU*other*nt/fs)]);
 }
 drawChart('plot0',{xmin:0,xmax:nmax,ymin:-1.15,ymax:1.15,
  xlabel:'normalized time t/T_s',ylabel:'amplitude',xticks:6,
  series:[{xy:analog1,color:C.teal,width:1.9},
          {xy:analog2,color:C.coral,width:1.6,dash:true},
          {xy:samples,color:C.ink,type:'stem',radius:3.8}]});
 setLegend(0,[
  {kind:'line',color:C.teal,label:`Solid: analog ${f} Hz`},
  {kind:'dashed',color:C.coral,label:`Red dashed: analog ${other} Hz (= f_s − f)`},
  {kind:'stem',color:C.ink,label:`Black stems/dots: N=${N} discrete samples x[n]`}]);
 // Use the exact same visible N samples for the finite-record DTFT.
 const freq=[];
 for(let k=0;k<=720;k++){
  const freqPi=-2+4*k/720,om=freqPi*PI;
  freq.push([freqPi,mag(spectrum(samples,om))/N]);
 }
 drawChart('plot1',{xmin:-2,xmax:2,ymin:0,ymax:1.08,
  xlabel:'digital frequency Ω/π',ylabel:'|X_N|/N',xticks:8,
  series:[{xy:freq,color:C.teal,width:2.6}],
  vlines:[{x:-1,color:C.gold},{x:1,color:C.gold}]});
 setLegend(1,[
  {kind:'line',color:C.teal,label:`DTFT magnitude of ${N} displayed samples`},
  {kind:'vline',color:C.gold,label:'±π boundaries (spectrum repeats every 2π)'}]);
 setFormula(`f<sub>s</sub> = ${fs} Hz &nbsp;·&nbsp; T<sub>s</sub> = ${clean(1000/fs,2)} ms &nbsp;·&nbsp; Ω = 2πf/f<sub>s</sub> = ${clean(2*f/fs,3)}π rad/sample`);
 setMetrics([
  [`${clean(2*f/fs,3)} π`,'rad/sample; Ω = 2πf/f_s'],
  [`${other} Hz`,`f₂ = f_s − f = ${fs} − ${f} Hz`],
  [`${clean(maxDiff,11)}`,'same value at each sampling instant']]);
 setInsight(`Sampling at f_s=${fs} Hz means T_s=${clean(1000/fs,2)} ms. Solid teal is ${f} Hz; dashed red is a different analog waveform at ${other} Hz. Black stems are the actual samples x[n]. Both analog curves pass through every sample at t=nT_s. N=${N} changes only the number of displayed samples (and the DTFT observation length), not the sampling rate. The lower finite-record DTFT repeats every 2π in Ω.`);
}
function makePairSequence(s){const seq=[];for(let n=-14;n<=30;n++){let x=0;if(s.kind==='impulse')x=n===0?1:0;else if(s.kind==='shift')x=n===s.n0?1:0;else if(s.kind==='exp')x=n>=0?Math.pow(s.a,n):0;else if(s.kind==='rect')x=n>=0&&n<s.m?1:0;else if(s.kind==='sym')x=Math.pow(s.a,Math.abs(n));seq.push([n,x])}return seq}
function pairTransform(s,w){if(s.kind==='impulse')return[1,0];if(s.kind==='shift')return cis(-w*s.n0);if(s.kind==='exp'){const ar=1-s.a*Math.cos(w),ai=s.a*Math.sin(w),den=ar*ar+ai*ai;return[ar/den,-ai/den]}if(s.kind==='sym'){const v=(1-s.a*s.a)/(1-2*s.a*Math.cos(w)+s.a*s.a);return[v,0]}const seq=[];for(let n=0;n<s.m;n++)seq.push([n,1]);return spectrum(seq,w)}
function drawPairs(s){const seq=makePairSequence(s),xs=seq.filter(q=>q[0]>=-12&&q[0]<=28),ym=Math.max(1.15,...xs.map(p=>p[1]*1.13));drawChart('plot0',{xmin:-12,xmax:28,ymin:-.08,ymax:ym,xlabel:'sample index n',ylabel:'x[n]',xticks:8,series:[{xy:xs,color:C.teal,type:'stem',radius:2.6}]});const vals=[];for(let i=0;i<=600;i++){const w=-PI+2*PI*i/600,Z=pairTransform(s,w);const abs=mag(Z);vals.push([w/PI,s.showphase==='phase'?(abs<1e-7?NaN:Math.atan2(Z[1],Z[0])):abs])}let maxmag=Math.max(...vals.map(v=>Number.isFinite(v[1])?v[1]:0)),ph=s.showphase==='phase';drawChart('plot1',{xmin:-1,xmax:1,ymin:ph?-PI-0.2:0,ymax:ph?PI+0.2:Math.max(1.1,maxmag*1.08),xlabel:'\u03a9/\u03c0',ylabel:ph?'phase (rad)':'|X(e^{j\u03a9})|',xticks:4,series:[{xy:vals,color:C.coral,width:2.7}]});let dc=pairTransform(s,0),ny=pairTransform(s,PI),clue='';if(s.kind==='impulse'||s.kind==='shift')clue='Flat magnitude';if(s.kind==='exp')clue=`a=${clean(s.a,2)}, |a|<1`;if(s.kind==='rect')clue=`First zero = 2\u03c0/${s.m}`;if(s.kind==='sym')clue='Real, even spectrum';setMetrics([[clean(mag(dc),3),'Sum of all samples'],[clean(mag(ny),3),'|X(e^{j\u03c0})|'],[clue,'Interpret the structure']]);let eq={impulse:'X(e<sup>j\u03a9</sup>) = 1',shift:`X(e<sup>j\u03a9</sup>) = e<sup>\u2212j\u03a9${s.n0}</sup>`,exp:`X(e<sup>j\u03a9</sup>) = 1 / (1 \u2212 ${clean(s.a,2)} e<sup>\u2212j\u03a9</sup>)`,rect:`X(e<sup>j\u03a9</sup>) = e<sup>\u2212j\u03a9(${s.m}\u22121)/2</sup> \u00d7 sin(${s.m}\u03a9/2) / sin(\u03a9/2)`,sym:`X(e<sup>j\u03a9</sup>) = (1 \u2212 a<sup>2</sup>) / (1 \u2212 2a cos\u03a9 + a<sup>2</sup>)`}[s.kind];setFormula(eq);const tips={impulse:'One nonzero sample produces the same magnitude at all digital frequencies.',shift:'Shifting an impulse keeps |X|=1 and rotates its phase. Magnitude alone cannot reveal the time index.',exp:'This convergent geometric series has a strong DC value when a is close to 1. The infinite sum requires |a|<1.',rect:'Longer time rectangles have narrower central lobes and more closely spaced zeros. At \u03a9=0 use the original sum to avoid 0/0.',sym:'A real-even two-sided sequence has a real-even DTFT. Compare its magnitude with the causal exponential.'};setInsight(tips[s.kind])}
function drawPhase(s){const base=[],shifted=[],N=28;for(let n=0;n<=N;n++){base.push([n,n<s.m?1:0]);shifted.push([n,n>=s.n0&&n<s.n0+s.m?1:0])}drawChart('plot0',{xmin:0,xmax:26,ymin:-.08,ymax:1.2,xlabel:'n (samples)',ylabel:'x[n]',series:[{xy:base,color:C.gray,type:'stem',radius:2.4},{xy:shifted,color:C.coral,type:'stem',radius:3}]});const orig=[],delayed=[],diff=[];for(let i=0;i<=300;i++){const w=PI*i/300,z=pairTransform({kind:'rect',m:s.m},w),v=mag(z);orig.push([w/PI,v]);delayed.push([w/PI,v]);diff.push([w/PI,-w*s.n0])}drawChart('plot1',{xmin:0,xmax:1,ymin:0,ymax:s.m*1.1,xlabel:'\u03a9/\u03c0',ylabel:'|X|',series:[{xy:orig,color:C.teal,width:3},{xy:delayed,color:C.coral,dash:true,width:1.8}]});drawChart('plot2',{xmin:0,xmax:1,ymin:Math.min(-PI*s.n0-1,-1),ymax:.5,xlabel:'\u03a9/\u03c0',ylabel:'phase difference (rad)',series:[{xy:diff,color:C.coral,width:3}]});setMetrics([[`${s.n0} samples`,'Time shift'],['0','Original vs shifted |X|'],[`${-s.n0} rad/(rad/sample)`,'-n0; phase slope']]);setInsight(`A ${s.n0}-sample delay contributes exp(-j\u03a9${s.n0}). The unwrapped phase difference is -${s.n0}\u03a9. At spectral zeros the individual phase is undefined; phase wrapping may create visual jumps.`)}
function drawAverage(s){const w=s.w*PI,M=s.m,Z=maH(M,w);drawPhasors('plot0',M,w);const response=[];for(let i=0;i<=450;i++){const x=i/450,responseMag=mag(maH(M,x*PI));response.push([x,responseMag])}drawChart('plot1',{xmin:0,xmax:1,ymin:0,ymax:1.08,xlabel:'digital frequency \u03a9/\u03c0',ylabel:'|H|',series:[{xy:response,color:C.teal,width:2.8}],vlines:[{x:s.w,color:C.coral}],points:[{x:s.w,y:mag(Z),color:C.coral,radius:5}]});setMetrics([[clean(mag(Z),4),`\u03a9=${clean(s.w,2)}\u03c0`],['1.000','At DC, all M arrows align'],[`${clean((M-1)/2,1)} samples`,'Linear-phase slope near passband']]);setInsight(`Each tap contributes one phasor of length 1/${M}. At \u03a9=0, the M arrows align and |H|=1. At selected higher frequencies they may cancel. For this filter, zeros occur at 2\u03c0k/${M}, excluding multiples of 2\u03c0.`)}
function drawFilter(s){const fs=100,N=220,M=s.m,signal=[],filtered=[];for(let n=0;n<N;n++)signal.push(20+Math.cos(TAU*s.fu*n/fs)+s.an*Math.cos(TAU*s.fn*n/fs));for(let n=0;n<N;n++){let sum=0;for(let k=0;k<M;k++)if(n>=k)sum+=signal[n-k];filtered.push(sum/M)}const from=s.startup==='startup'?0:Math.max(M+12,60),count=90;const inp=[],out=[];for(let n=from;n<from+count&&n<N;n++){inp.push([n/fs,signal[n]]);out.push([n/fs,filtered[n]])}let ymin=s.startup==='startup'?-1:18,ymax=22.5;drawChart('plot0',{xmin:from/fs,xmax:(from+count-1)/fs,ymin,ymax,xlabel:'time (seconds)',ylabel:'sensor units',series:[{xy:inp,color:C.gray,width:1.8},{xy:out,color:C.teal,width:2.5}],band:s.startup==='startup'?{from:0,to:(M-1)/fs,color:'rgba(239,112,85,.11)'}:null});const gains=[];for(let i=0;i<=440;i++){let xx=i/440;gains.push([xx,mag(maH(M,xx*PI))])}const gu=mag(maH(M,TAU*s.fu/fs)),gn=mag(maH(M,TAU*s.fn/fs)),delay=(M-1)/(2*fs)*1000;drawChart('plot1',{xmin:0,xmax:1,ymin:0,ymax:1.08,xlabel:'digital frequency \u03a9/\u03c0',ylabel:'|H|',series:[{xy:gains,color:C.teal,width:2.7}],points:[{x:2*s.fu/fs,y:gu,color:C.teal,radius:5.1},{x:2*s.fn/fs,y:gn,color:C.coral,radius:5.1}],vlines:[{x:2*s.fu/fs,color:C.teal},{x:2*s.fn/fs,color:C.coral}]});setMetrics([[`${clean(gu*100,2)}%`,`${s.fu} Hz output / input amplitude`],[`${clean(gn*100,2)}%`,`${s.fn} Hz interference; output amplitude ${clean(gn*s.an,3)}`],[`${clean(delay,1)} ms`,`${clean((M-1)/2,1)} samples at fs=100 Hz`]]);setInsight(`M=${M}: useful ${s.fu} Hz amplitude = ${clean(gu,4)} (input amplitude 1), noise ${s.fn} Hz amplitude = ${clean(s.an*gn,4)} (input amplitude ${s.an}), passband delay = ${clean(delay,1)} ms. ${s.startup==='startup'?'The shaded early interval contains startup behavior under a zero-prehistory assumption.':'This view excludes initial startup samples for a steadier comparison.'}`)}
function fft(re,im){const n=re.length;let j=0;for(let i=1;i<n;i++){let bit=n>>1;while(j&bit){j^=bit;bit>>=1}j^=bit;if(i<j){let a=re[i];re[i]=re[j];re[j]=a;a=im[i];im[i]=im[j];im[j]=a}}for(let len=2;len<=n;len<<=1){const theta=-TAU/len;for(let start=0;start<n;start+=len){for(let k=0;k<(len>>1);k++){const ang=theta*k,c=Math.cos(ang),sn=Math.sin(ang),i=start+k,jj=i+len/2,tr=c*re[jj]-sn*im[jj],ti=sn*re[jj]+c*im[jj];re[jj]=re[i]-tr;im[jj]=im[i]-ti;re[i]+=tr;im[i]+=ti}}}return{re,im}}
// Spectrum corresponds to the SAME real cosine displayed in the time plot.
function fftSignal(N,L,f,win,fs){const re=new Float64Array(L),im=new Float64Array(L);let sum=0;for(let n=0;n<N;n++){const w=win==='hann'?.5-.5*Math.cos(TAU*n/(N-1)):1;re[n]=w*Math.cos(TAU*f*n/fs);sum+=w}fft(re,im);const out=new Float64Array(L/2+1);for(let k=0;k<out.length;k++)out[k]=2*Math.hypot(re[k],im[k])/sum;return out}
function fftGuide(s,N,fs){const cycles=N*s.f/fs,nearest=Math.round(cycles),coherent=Math.abs(cycles-nearest)<1e-8,el=$('fftstatus');if(el){el.innerHTML=window.SSContentModel.html(`<b>${clean(cycles,2)} cycles</b> during ${clean(N/fs,2)} seconds. Nearest bin k=${nearest}, f=${clean(nearest*fs/N,3)} Hz. ${coherent?'✅ 정수 주기, FFT bin 일치.':'⚠ 비정수 주기, FFT bin과 불일치 → leakage.'}<span>${s.window==='hann'?'Hann: 먼 sidelobe는 감소하지만 main lobe는 넓어집니다.':'Rectangular: main lobe는 좁지만 먼 sidelobe가 큽니다.'}</span>`)}const presets={aligned:['rect',4,'1'],offbin:['rect',4.15,'1'],hann:['hann',4.15,'1'],padding:['hann',4.15,'4']};document.querySelectorAll('[data-fft-preset]').forEach(b=>{const [w,f,pad]=presets[b.dataset.fftPreset],yes=N===512&&s.window===w&&Math.abs(s.f-f)<1e-8&&String(s.pad)===pad;b.classList.toggle('selected',yes);b.setAttribute('aria-pressed',yes?'true':'false')})}
function drawFFT(s){const N=Number(s.n),pad=Number(s.pad),fs=128,L=N*pad,time=[],up=[],down=[];for(let n=0;n<N;n++){const env=s.window==='hann'?.5-.5*Math.cos(TAU*n/(N-1)):1;time.push([n,Math.cos(TAU*s.f*n/fs)*env]);up.push([n,env]);down.push([n,-env])}
 drawChart('plot0',{xmin:0,xmax:N-1,ymin:-1.14,ymax:1.14,xlabel:'sample index n (full record)',ylabel:'xw[n]',xticks:5,series:[{xy:up,color:C.gray,width:1.2,dash:true},{xy:down,color:C.gray,width:1.2,dash:true},{xy:time,color:C.teal,width:1.8}]});setLegend(0,[{label:'Observed real cosine × window',color:C.teal,kind:'line'},{label:`±${s.window==='hann'?'Hann':'Rectangular'} envelope`,color:C.gray,kind:'dashed'}]);
 const dense=fftSignal(N,8192,s.f,s.window,fs),dft=fftSignal(N,L,s.f,s.window,fs),curve=[],dots=[];let peak=0,peakK=0;for(let k=0;k<dense.length;k+=3){const f=k*fs/8192;if(f>13)break;curve.push([f,dense[k]])}for(let k=0;k<dft.length;k++){const f=k*fs/L;if(f>13)break;dots.push([f,dft[k]]);if(dft[k]>peak){peak=dft[k];peakK=k}}
 drawChart('plot1',{xmin:0,xmax:13,ymin:0,ymax:1.1,xlabel:'frequency (Hz)',ylabel:'2|X| / Σw',xticks:6,series:[{xy:curve,color:C.ink,width:2.2},{xy:dots,color:C.coral,type:'stem',radius:pad>2?1.7:2.9}],vlines:[{x:s.f,color:C.teal}],points:[{x:peakK*fs/L,y:peak,color:C.coral,radius:4.7}]});setLegend(1,[{label:'Finite-record DTFT (dense curve)',color:C.ink,kind:'line'},{label:`${L}-point FFT/DFT bins`,color:C.coral,kind:'stem'},{label:'Actual tone f',color:C.teal,kind:'vline'}]);
 const rect=fftSignal(N,8192,s.f,'rect',fs),hann=fftSignal(N,8192,s.f,'hann',fs),ra=[],ha=[];for(let k=0;k<rect.length;k+=3){const hz=k*fs/8192;if(hz>13)break;ra.push([hz,Math.max(-85,20*Math.log10(Math.max(rect[k],1e-8)))]);ha.push([hz,Math.max(-85,20*Math.log10(Math.max(hann[k],1e-8)))])}
 drawChart('plot2',{xmin:0,xmax:13,ymin:-85,ymax:5,xlabel:'frequency (Hz)',ylabel:'normalized amplitude (dB)',xticks:8,series:[{xy:ra,color:C.coral,width:s.window==='rect'?2.9:1.8,dash:s.window!=='rect'},{xy:ha,color:C.teal,width:s.window==='hann'?2.9:1.8,dash:s.window!=='hann'}],vlines:[{x:s.f,color:C.gray}]});setLegend(2,[{label:'Rectangular',color:C.coral,kind:'line'},{label:'Hann',color:C.teal,kind:'line'},{label:'Tone frequency',color:C.gray,kind:'vline'}]);
 const df=fs/N,spacing=fs/L,cycles=N*s.f/fs,coherent=Math.abs(cycles-Math.round(cycles))<1e-8;setMetrics([[`${clean(df,3)} Hz`,'Δf = fs/N (N real measurements)'],[`${clean(spacing,4)} Hz`,'fs/(N × pad factor)'],[`${clean(N/fs,2)} s`,'unchanged by zero padding']]);
 fftGuide(s,N,fs);setFormula('x<sub>w</sub>[n] = w[n] cos(2πfn/f<sub>s</sub>) &nbsp; | &nbsp; X[k] = Σ x<sub>w</sub>[n]e<sup>−j2πkn/L</sup>');
 setInsight(`${clean(cycles,2)} cycles of a REAL cosine are observed. ${coherent?'With rectangular window and integer cycles the DFT has a single ideal positive-frequency bin.':'Fractional cycles place the tone between original DFT bins, producing spectral leakage over many bins.'} Hann tapers both ends, reducing distant sidelobes but broadening the central lobe. Even on-bin Hann data can occupy neighboring DFT bins. The navy curve is dense finite-record DTFT; orange stems sample it at FFT bins and the green line marks the actual tone f. Zero padding refines only the bin spacing to ${clean(spacing,4)} Hz, without extending the ${clean(N/fs,2)} s observation.`)}
shell();renderModule();
/* Re-render the initial Chapter 6 equation after KaTeX has loaded. */
window.addEventListener('load',()=>{const el=document.getElementById('formula');if(el&&active==='periodic')setFormula(el.innerHTML)},{once:true});

window.__dtftChecks={
