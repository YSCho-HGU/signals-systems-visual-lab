 function hide(st){st.tip.style.display='none';st.v.style.display='none';st.h.style.display='none';st.dot.style.display='none';st.lastX=null}

  for(const p of data||[]){if(!p||!Number.isFinite(p[0])||!Number.isFinite(p[1])||p[0]<xmin-1e-9||p[0]>xmax+1e-9)continue;const delta=Math.abs(p[0]-x);if(delta<bestDelta){bestDelta=delta;best=p}}

 function readSeries(st,x,y){const d=st.d;const values=[];

   const s=d.series[i];let v=null,sx=x,method='formula';

     const extra=v.method==='formula'?'':` @ x=${fmt(v.x)}`;

{id:'harm',short:'Harmonically Related Sinusoids',section:'§3.3',title:'Harmonically Related Sinusoids / 조화 정현파',desc:'One fundamental angular frequency generates integer-multiple harmonics. / 기본 각주파수의 정수배로 신호를 구성합니다.',formula:'x(t)=cos(ω<sub>0</sub>t)+A cos(2ω<sub>0</sub>t+φ), &nbsp; ω<sub>0</sub>=2π/T',defaults:{T:4,A:.65,phi:0},controls:[{key:'T',label:'Fundamental period T / 기본 주기',type:'range',min:2,max:8,step:.5,unit:' s'},{key:'A',label:'2nd harmonic amplitude A / 2차 진폭',type:'range',min:0,max:1.5,step:.05},{key:'phi',label:'Phase φ / 위상',type:'range',min:-180,max:180,step:15,unit:'°'}],plots:[['Time waveform / 시간 파형','Sum of the 1st and 2nd harmonics'],['Line spectrum |aₖ| / 선 스펙트럼','Complex Fourier coefficients, k = ±1, ±2']],metrics:['Fundamental f₀ / 기본 주파수','Second harmonic |a₂|','Period of the sum'],question:'Why is a₂ half the real cosine amplitude A?',questionKo:'실수 cosine의 진폭이 A인데 복소 푸리에 계수 크기는 왜 A/2인가요?',answer:'Euler relation: A cos(2ω₀t+φ) = (A/2)e^{jφ}e^{j2ω₀t}+(A/2)e^{-jφ}e^{-j2ω₀t}. The +2 and −2 coefficients form a conjugate pair. / 실수 cosine 하나는 복소 지수 두 항으로 구성됩니다.',draw(s){const T=s.T,w=TAU/T,ph=s.phi*PI/180;const a=sample(-12,12,1200,t=>Math.cos(w*t)),b=sample(-12,12,1200,t=>s.A*Math.cos(2*w*t+ph)),y=sample(-12,12,1200,t=>Math.cos(w*t)+s.A*Math.cos(2*w*t+ph));paintGraph('plot0',{x:[-12,12],y:[-2.8,2.8],xstep:4,axisnote:'Fixed time view: −12 to +12 s. Change T to see the number of cycles change. / 주기 변경에도 시간축은 고정됩니다.',vlines:[{x:T,color:C.gold,label:'next period t=T'}],xlabel:'time t (s)',ylabel:'amplitude',series:[{data:a,color:C.gray,dash:true,width:1.3,label:'1st harmonic'},{data:b,color:C.gold,dash:true,width:1.5,label:'2nd harmonic'},{data:y,color:C.teal,width:2.6,label:'sum x(t)'}]});const sk=[[-2,s.A/2],[-1,.5],[0,0],[1,.5],[2,s.A/2]];paintGraph('plot1',{x:[-3,3],y:[0,1],xstep:1,xlabel:'harmonic index k',ylabel:'|aₖ|',series:[{data:sk,color:C.coral,type:'stem',label:'complex |aₖ|'}]});setMetrics([[`${fmt(1/T)} Hz`,'f₀ = 1/T'],[fmt(s.A/2),'a₂ = (A/2)e^{jφ}'],[`${fmt(T)} s`,'The first harmonic fixes the fundamental period']]);setInsight('Each harmonic frequency is kω₀; negative and positive coefficients form conjugate pairs for real signals. / 실수 신호에서 ±k 계수는 복소켤레 쌍입니다.')}} ,
{id:'rectfs',short:'CTFS of a Pulse Train',section:'§§3.3–3.4',title:'CTFS of a Periodic Pulse / 주기 펄스의 CTFS',desc:'Adjust duty cycle and inspect the signed Fourier-series coefficients aₖ. / Duty cycle에 따른 계수의 부호와 영점을 관찰하세요.',formula:'a<sub>k</sub>=(τ/T) sinc(kπτ/T), &nbsp; sinc(x)=sin(x)/x',defaults:{T:6,tau:2,K:12},controls:[{key:'T',label:'Period T / 반복 주기',type:'range',min:4,max:10,step:1,unit:' s'},{key:'tau',label:'Pulse width τ / 펄스 폭',type:'range',min:.5,max:3.5,step:.5,unit:' s'},{key:'K',label:'Displayed harmonic range K',type:'range',min:5,max:20,step:1}],plots:[['Periodic pulse train / 주기 펄스열','Unit-height, origin-centered pulses'],['Signed coefficients aₖ / 부호 있는 계수','Signed real-even spectrum; negative stems matter']],metrics:['DC coefficient a₀','Duty cycle τ/T','First zero (when integer k exists)'],question:'What happens to a₀ as the pulse width increases?',questionKo:'펄스의 높이를 일정하게 유지하고 폭 τ를 늘리면 DC 계수는 어떻게 변할까요?',answer:'a₀ equals the average signal value over one period: a₀ = τ/T. It grows with duty cycle. At integer k where kτ/T is a nonzero integer, aₖ=0. / 평균값이 증가하고 특정 고조파가 상쇄됩니다.',draw(s){const tau=Math.min(s.tau,s.T-.1),T=s.T,K=s.K;paintGraph('plot0',{x:[-14,14],y:[-.15,1.3],xstep:4,axisnote:'Fixed time view: −14 to +14 s; dashed marks show one period. / 동일 축에서 반복 주기를 비교하세요.',vlines:[{x:0,color:C.gray,label:'pulse center t=0'},{x:T,color:C.gold,label:'t=T'}],xlabel:'time t (s)',ylabel:'x(t)',series:[{data:sample(-14,14,1400,t=>rectTrain(t,T,tau)),color:C.teal,label:'periodic rectangle'}]});let pts=[];for(let k=-K;k<=K;k++)pts.push([k,fsRect(k,T,tau)]);const d=tau/T;paintGraph('plot1',{x:[-21,21],y:[-.45,.95],xstep:5,ystep:.2,axisnote:'Fixed harmonic-index view: −21 to +21. K changes the number of displayed coefficients, not zoom. / K를 늘리면 선이 추가됩니다.',xlabel:'harmonic index k',ylabel:'aₖ (signed)',series:[{data:pts,color:C.coral,type:'stem',label:'signed aₖ'}]});let first=Number.isInteger(T/tau)?`${fmt(T/tau)}`:'not at an integer k';setMetrics([[fmt(d),'average over T'],[`${fmt(100*d)}%`,'τ/T'],[first,'k = T/τ, if an integer']]);setInsight('Unlike a magnitude spectrum, the signed coefficient diagram retains negative signs. The envelope narrows in harmonic index as τ/T increases. / 부호 있는 계수와 크기 스펙트럼을 혼동하지 마세요.')}} ,
{id:'gibbs',short:'Fourier Partial Sums & Gibbs',section:'§3.4',title:'Fourier Partial Sums and Gibbs / 부분합과 깁스 현상',desc:'Increase odd harmonics to sharpen edges and inspect persistent overshoot. / 조화 항을 늘려 불연속점 주변을 관찰하세요.',formula:'S<sub>M</sub>(t)=(4/π) Σ<sub>n=0</sub><sup>M−1</sup> sin[(2n+1)πt]/(2n+1)',defaults:{M:8},controls:[{key:'M',label:'Number of odd harmonics M / 홀수 조화 수',type:'range',min:1,max:40,step:1}],plots:[['Square-wave approximation / 구형파 근사','Reference ±1 versus Fourier partial sum'],['Zoom at a jump / 불연속점 확대','Gibbs overshoot near t = 0']],metrics:['Maximum around the positive step','Overshoot / jump height','Value at jump t=0'],question:'Does the Gibbs overshoot vanish as M increases?',questionKo:'조화 항을 계속 늘리면 Gibbs overshoot의 높이가 0으로 줄어들까요?',answer:'No. The overshoot approaches about 8.949% of the jump height (jump=2, peak≈1.17898); its width shrinks. Exactly at the jump, the partial sum converges to the midpoint 0. / overshoot의 폭은 좁아져도 상대적인 높이는 남습니다.',draw(s){const M=s.M,ref=sample(-1.05,1.05,1300,squareRef),sum=sample(-1.05,1.05,1300,t=>squarePartial(t,M));paintGraph('plot0',{x:[-1.05,1.05],y:[-1.6,1.6],axisnote:'Fixed overview: −1.05 to +1.05. The jump location does not move as M changes. / 불연속점 위치를 비교하세요.',xlabel:'time t / period = 2',ylabel:'amplitude',series:[{data:ref,color:C.gray,dash:true,width:1.5,label:'ideal square wave'},{data:sum,color:C.teal,width:2.4,label:'partial sum Sₘ(t)'}]});const small=sample(-.4,.4,1200,t=>squarePartial(t,M));const ideal=sample(-.4,.4,1200,squareRef);paintGraph('plot1',{x:[-.4,.4],y:[-1.55,1.55],axisnote:'Fixed zoom: −0.4 to +0.4. Notice overshoot becomes narrower, not necessarily lower. / overshoot 폭을 관찰하세요.',xlabel:'time near the jump',ylabel:'amplitude',series:[{data:ideal,color:C.gray,dash:true,width:1.4,label:'reference'},{data:small,color:C.coral,width:2.5,label:'Sₘ(t)'}]});let peak=-Infinity;for(let i=0;i<=2000;i++){const t=i*.35/2000;peak=Math.max(peak,squarePartial(t,M))}setMetrics([[fmt(peak),'measured in 0≤t≤0.35'],[`${fmt(Math.max(0,peak-1)*50)}%`,'(peak − 1) / 2 × 100; jump = 2'],['0','midpoint of −1 and +1']]);setInsight('Partial sums minimize mean-square error over a period, but a jump produces Gibbs overshoot. The peak tends toward 1.17898 for this ±1 square wave. / 부분합은 평균제곱 오차를 줄이지만 불연속점 주변 overshoot는 남습니다.')}} ,
{id:'shift',short:'Time Shift & Fourier Phase',section:'§3.5',title:'Time Shift Changes Phase / 시간 이동과 위상',desc:'Move the pulse train without altering the coefficient magnitudes. / 시간 이동은 계수 크기가 아니라 위상을 바꿉니다.',formula:'x(t−t<sub>0</sub>) ↔ b<sub>k</sub> = a<sub>k</sub> e<sup>−jkω<sub>0</sub>t<sub>0</sub></sup>',defaults:{T:6,t0:1.5},controls:[{key:'T',label:'Period T / 주기',type:'range',min:4,max:10,step:1,unit:' s'},{key:'t0',label:'Time shift t₀ / 이동',type:'range',min:-3,max:3,step:.25,unit:' s'}],plots:[['Shifted pulse train / 이동한 파형','Gray reference; teal shifted pulse'],['Phase contribution / 이동에 따른 위상','−kω₀t₀: unwrapped additional phase']],metrics:['Shifted DC coefficient','Magnitude change','Slope of phase versus k'],question:'Can the magnitude spectrum alone tell whether the signal was delayed?',questionKo:'크기 스펙트럼만 보고 시간 이동이 있었는지 판단할 수 있나요?',answer:'No. |bₖ|=|aₖ|, while the shift contributes −kω₀t₀ to the phase. If an aₖ is negative, its own phase adds ±π; the graph shows only the additional phase caused by delay. / 이동으로 추가된 위상만 표시합니다.',draw(s){const T=s.T,tau=T/3,kk=Array.from({length:13},(_,i)=>i-6);paintGraph('plot0',{x:[-14,14],y:[-.15,1.3],xstep:4,axisnote:'Fixed time view: −14 to +14 s. The shifted waveform moves along this axis. / 이동량을 동일 시간축에서 비교하세요.',vlines:[{x:0,color:C.gray,label:'original center'},{x:s.t0,color:C.gold,label:'shift t₀'}],xlabel:'time t (s)',ylabel:'x(t)',series:[{data:sample(-14,14,1000,t=>rectTrain(t,T,tau)),color:C.gray,dash:true,label:'original'},{data:sample(-14,14,1000,t=>rectTrain(t,T,tau,s.t0)),color:C.teal,label:'shifted'}]});paintGraph('plot1',{x:[-6.5,6.5],y:[-32,32],xstep:2,ystep:8,axisnote:'Fixed phase scale: −32 to +32 rad. Slope depends on t₀/T. / 위상 기울기 변화를 비교하세요.',xlabel:'harmonic index k',ylabel:'Δphase (rad)',series:[{data:kk.map(k=>[k,-k*TAU*s.t0/T]),color:C.coral,type:'stem',label:'delay contribution'}]});setMetrics([[fmt(tau/T),'a₀ unchanged'],['0','|bₖ|−|aₖ|'],[`${fmt(-TAU*s.t0/T)} rad/k`,'−ω₀t₀']]);setInsight('Time shift multiplies each coefficient by a unit-magnitude phasor. / 지연은 복소 계수의 회전이며 크기 스펙트럼을 바꾸지 않습니다.')}} ,
{id:'dtfs',short:'DTFS & Periodicity',section:'§§3.6–3.7',title:'Discrete-Time Fourier Series / 이산시간 푸리에 급수',desc:'Compare a periodic N-point sequence with the N unique DTFS coefficients. / 주기적 수열과 N개 고유 계수를 비교합니다.',formula:'a<sub>k</sub>=(1/N) Σ<sub>n=0</sub><sup>N−1</sup> x[n]e<sup>−j2πkn/N</sup>, &nbsp; a<sub>k+N</sub>=a<sub>k</sub>',defaults:{N:'8',L:3},controls:[{key:'N',label:'Fundamental period N / 주기',type:'select',options:[['8','8'],['10','10'],['12','12'],['16','16']]},{key:'L',label:'Nonzero samples per period L / 펄스 길이',type:'range',min:1,max:6,step:1}],plots:[['Periodic DT sequence / 이산 주기 신호','x[n] = 1 for n mod N < L'],['DTFS line spectrum |aₖ| / 계수 크기','Periodic in harmonic index k with period N']],metrics:['DC coefficient a₀','Unique DTFS coefficients','Coefficient periodicity'],question:'Why are there only N distinct DTFS coefficients?',questionKo:'이산시간에서는 왜 DTFS 계수 종류가 N개뿐인가요?',answer:'e^{-j2π(k+N)n/N}=e^{-j2πkn/N} for integer n. Thus a_{k+N}=aₖ; k=0,...,N−1 is a complete unique set. / DTFS 계수는 조화 인덱스에서 N 주기입니다.',draw(s){const N=Number(s.N),L=Math.min(s.L,N),seq=[];for(let n=-18;n<=34;n++)seq.push([n,((n%N)+N)%N<L?1:0]);paintGraph('plot0',{x:[-18,34],y:[-.15,1.35],xstep:8,ystep:.25,bands:[{x0:0,x1:N,color:'rgba(14,132,145,.08)'}],vlines:[{x:0,color:C.gold,label:'n=0'},{x:N,color:C.gold,label:'n=N; next period'}],axisnote:`Fixed n-axis: −18 to +34. Shaded 0 ≤ n < ${N} is one complete period; the next starts at n=${N}. / 한 주기의 경계를 확인하세요.`,xlabel:'sample index n',ylabel:'x[n]',series:[{data:seq,color:C.teal,type:'stem',label:'periodic sequence'}]});const coeff=[];for(let k=-18;k<=34;k++){let re=0,im=0;for(let n=0;n<L;n++){re+=Math.cos(-TAU*k*n/N);im+=Math.sin(-TAU*k*n/N)}coeff.push([k,Math.hypot(re,im)/N])}paintGraph('plot1',{x:[-18,34],y:[0,.9],xstep:8,ystep:.2,bands:[{x0:0,x1:N,color:'rgba(14,132,145,.10)'}],vlines:[{x:0,color:C.gold,label:'k=0'},{x:N,color:C.purple,label:'k=N; repeat'}],axisnote:`N=${N}: highlighted indices k=0,…,${N-1} are one complete set of N DTFS coefficients. At k=${N}, the pattern repeats (aₖ₊ᴺ=aₖ). / N개 계수와 반복 경계를 확인하세요.`,xlabel:'harmonic index k',ylabel:'|aₖ|',series:[{data:coeff,color:C.coral,type:'stem',label:'periodic coefficients'}]});setMetrics([[fmt(L/N),'mean x[n]'],[`${N}`,'k=0,...,N−1'],[`${N}`,'aₖ₊ᴺ=aₖ']]);setInsight(`The shaded k=0,…,${N-1} band shows one full set of N coefficient indices; k=${N} repeats k=0. The signals repeat every N samples in n and the DTFS coefficients repeat every N indices in k. / 강조된 영역은 N개 계수 인덱스이며, k=N에서 다시 반복합니다.`)}} ,
{id:'filter',short:'Harmonic Filtering in LTI Systems',section:'§§3.8–3.10',title:'LTI Eigenfunctions and RC Filtering / 시스템 응답',desc:'A first-order RC lowpass attenuates and phase-shifts each harmonic independently. / 각 고조파가 독립적으로 감쇠하고 위상이 바뀝니다.',formula:'H(jω)=1/(1+jωτ), &nbsp; b<sub>k</sub>=H(jkω<sub>0</sub>)a<sub>k</sub>',defaults:{T:4,tau:.6},controls:[{key:'T',label:'Input period T / 주기',type:'range',min:2,max:8,step:.5,unit:' s'},{key:'tau',label:'Time constant τ / 시정수',type:'range',min:.1,max:2,step:.1,unit:' s'}],plots:[['Input vs output / 입력·출력 파형','x(t)=cos(ω₀t)+0.5cos(3ω₀t)'],['Magnitude spectrum / 고조파 크기','|aₖ| before and |bₖ| after lowpass']],metrics:['Fundamental gain |H(jω₀)|','Third-harmonic gain |H(j3ω₀)|','Cutoff angular frequency'],question:'Why does the output look smoother when τ increases?',questionKo:'RC 시정수 τ가 커지면 출력 파형이 부드러워지는 이유는 무엇인가요?',answer:'Higher-frequency harmonics (e.g., 3ω₀) are attenuated more strongly by |H(jω)|=1/√(1+(ωτ)²). Their phases also change. / 높은 조화 성분이 크게 감소하여 파형의 급격한 변동이 완화됩니다.',draw(s){const w=TAU/s.T,H=k=>{const a=k*w*s.tau;return [1/Math.hypot(1,a),-Math.atan(a)]};const y=t=>H(1)[0]*Math.cos(w*t+H(1)[1])+.5*H(3)[0]*Math.cos(3*w*t+H(3)[1]);paintGraph('plot0',{x:[-12,12],y:[-1.8,1.8],xstep:4,axisnote:'Fixed time view: −12 to +12 s; compare the number of oscillations and smoothing. / 주기를 바꾸어도 시간축은 일정합니다.',xlabel:'time t (s)',ylabel:'amplitude',series:[{data:sample(-12,12,1200,t=>Math.cos(w*t)+.5*Math.cos(3*w*t)),color:C.gray,dash:true,label:'input x(t)'},{data:sample(-12,12,1200,y),color:C.teal,label:'output y(t)'}]});const orig=[[-3,.25],[-1,.5],[0,0],[1,.5],[3,.25]],out=orig.map(([k,a])=>[k,a*H(k)[0]]);paintGraph('plot1',{x:[-4,4],y:[0,.65],xstep:1,xlabel:'harmonic index k',ylabel:'coefficient magnitude',series:[{data:orig,color:C.gray,type:'stem',label:'|aₖ| input'},{data:out,color:C.coral,type:'stem',label:'|bₖ| output'}]});setMetrics([[fmt(H(1)[0]),'k=1'],[fmt(H(3)[0]),'k=3'],[`${fmt(1/s.tau)} rad/s`,'ωc=1/τ']]);setInsight('For a stable LTI system, complex exponentials are eigenfunctions. Each spectral line is multiplied by H(jkω₀). / 컨벌루션을 직접 하지 않고도 주기 신호의 출력 성분을 예측할 수 있습니다.')}} ,
{id:'midpoint',short:'Convergence at Jumps',section:'§3.4',title:'Value at a Jump / 불연속점의 수렴값',desc:'Changing one isolated sample in a CT function does not change its Fourier-series coefficients. / 한 점의 함수값 변경이 계수에 미치는 영향을 확인합니다.',formula:'S(0)=[x(0<sup>−</sup>)+x(0<sup>+</sup>)]/2 = 0, regardless of x(0)',defaults:{M:12,special:8},controls:[{key:'M',label:'Odd harmonic terms M / 항 수',type:'range',min:1,max:30,step:1},{key:'special',label:'Assigned x(0) / 원점의 지정값',type:'range',min:0,max:10,step:1}],plots:[['Point value versus side limits / 한 점의 값','Square wave near t=0, x(0) selected separately'],['Partial sum at a jump / 불연속점의 부분합','Fourier sum converges to the midpoint 0']],metrics:['Assigned x(0)','Midpoint of side limits','Fourier partial sum Sₘ(0)'],question:'Will changing x(0) from 0 to 10 change the Fourier coefficients?',questionKo:'불연속점 한 곳의 값 x(0)을 10으로 바꾸어도 Fourier 계수는 변하지 않나요?',answer:'No. Changing a function at a single time instant does not change the integral used in CTFS analysis. The partial sum at the jump converges to the midpoint 0 under the stated conditions. / 원래 함수값 x(0)과 Fourier 급수의 수렴값 S(0)은 다를 수 있습니다.',draw(s){const ref=sample(-.6,.6,500,t=>t===0?NaN:(t<0?-1:1)),partial=sample(-.5,.5,650,t=>squarePartial(t,s.M));paintGraph('plot0',{x:[-.6,.6],y:[-2,12],xstep:.2,ystep:2,axisnote:'Fixed axes: t=−0.6…+0.6 and y=−2…12. The assigned value changes only at t=0. / 한 점의 지정값만 바뀝니다.',xlabel:'time t',ylabel:'x(t)',series:[{data:ref,color:C.gray,dash:true,label:'left/right limits'}],points:[{x:0,y:s.special,color:C.coral,r:5}]});paintGraph('plot1',{x:[-.5,.5],y:[-1.55,1.55],xstep:.2,axisnote:'Fixed close-up: −0.5…+0.5. The Fourier sum stays Sₘ(0)=0 despite changing x(0). / 부분합은 원점에서 0입니다.',xlabel:'time near t=0',ylabel:'Sₘ(t)',series:[{data:partial,color:C.teal,label:'partial sum'}],points:[{x:0,y:0,color:C.coral,r:5}]});setMetrics([[fmt(s.special),'specified value at one point'],['0','(−1+1)/2'],['0','sin(kπ·0)=0 for every k']]);setInsight('A Fourier-series sum at a jump need not equal the specifically assigned x(0). Coefficients are unchanged by a single-point modification. / 측정한 한 점의 값보다 좌우극한과 중간값 규칙이 중요합니다.')}}
];

const item=(head,math,ko)=>({head,math,ko});

const guideItem=(head,math,ko)=>({head,math,ko});

const guideView={count:{},previous:{},timer:null,playing:false,duration:2600,lastModule:null};
function stopGuidePlay(){if(guideView.timer!==null){clearInterval(guideView.timer);guideView.timer=null}guideView.playing=false}
function revealGuide(moduleId,state,guideFactory){
 const pane=document.getElementById('derivationPanel'),rp=document.getElementById('readingPanel');if(!pane||!rp)return;
 const rawGuide=guideFactory(state),d=window.SSContentModel.model(rawGuide),total=d.steps.length;
 const n=Math.max(1,Math.min(total,guideView.count[moduleId]||1));
 const animate=guideView.previous[moduleId]!==undefined&&n>guideView.previous[moduleId]&&n===guideView.previous[moduleId]+1;
 const displayStep=(v,i)=>`<article class="deriv-step ${animate&&i===n-1?'guide-enter':''}" aria-label="Step ${i+1} of ${total}"><div class="deriv-top"><span class="step-index">${i+1}</span><strong>${v.head}</strong></div><div class="deriv-math">${v.math}</div><p>${v.ko}</p></article>`;
 pane.innerHTML=window.SSContentModel.html(`<div class="guide-head"><div><div class="overlabel">GUIDED DERIVATION / 단계별 수식 유도</div><h3>Equation → Derivation → Meaning / 수식 유도와 의미</h3><p>Adjust a variable to update the equations. / 변수를 변경하면 아래 수식도 갱신됩니다.</p></div><span class="progress-badge" role="status">Step ${n} / ${total}</span></div><div class="guide-track" role="progressbar" aria-valuemin="1" aria-valuemax="${total}" aria-valuenow="${n}" aria-label="Derivation progress"><div style="width:${100*n/total}%"></div></div><div class="guide-steps">${d.steps.slice(0,n).map(displayStep).join('')}</div><div class="guide-actions"><button id="previousStep" type="button" ${n<=1?'disabled':''}>◀ Previous / 이전</button><button id="nextStep" type="button" ${n>=total?'disabled':''}>Next step / 다음 ▶</button><button id="guidePlay" type="button" class="primary" aria-pressed="${guideView.playing}">${guideView.playing?'Pause animation / 일시정지':'▶ Play animation / 자동 전개'}</button><button id="allSteps" type="button">${n===total?'Restart / 처음부터':'Show all / 전체 보기'}</button></div>`);
 const change=next=>{guideView.count[moduleId]=Math.max(1,Math.min(total,next));revealGuide(moduleId,state,guideFactory)};
 pane.querySelector('#previousStep').onclick=()=>{stopGuidePlay();change(n-1)};
 pane.querySelector('#nextStep').onclick=()=>{stopGuidePlay();change(n+1)};
 pane.querySelector('#allSteps').onclick=()=>{stopGuidePlay();change(n===total?1:total)};
 pane.querySelector('#guidePlay').onclick=()=>{
  if(guideView.playing){stopGuidePlay();revealGuide(moduleId,state,guideFactory);return}
  if(n===total)guideView.count[moduleId]=1;
  guideView.playing=true;
  revealGuide(moduleId,state,guideFactory);
  guideView.timer=setInterval(()=>{
   if(currentGuidedId()!==moduleId){stopGuidePlay();return}
   const now=guideView.count[moduleId]||1;
   if(now>=total){stopGuidePlay();revealGuide(moduleId,currentGuidedState(moduleId),guideFactory);return}
   guideView.count[moduleId]=now+1;
   revealGuide(moduleId,currentGuidedState(moduleId),guideFactory);
   if(now+1>=total){stopGuidePlay();const b=pane.querySelector('#guidePlay');if(b){b.textContent='▶ Play animation / 자동 전개';b.setAttribute('aria-pressed','false')}}
  },guideView.duration)
 };
 guideView.previous[moduleId]=n;
 rp.innerHTML=window.SSContentModel.html(`<div class="overlabel">READ THE GRAPHS / 그래프 해석</div><h3>What changed, and why? / 무엇이 왜 바뀌었을까요?</h3><div class="reading-grid">${d.graphs.map((v,i)=>`<div class="reading-note"><span class="plot-number">GRAPH ${String(i+1).padStart(2,'0')}</span><strong>${v.title}</strong><p>${window.SSContentModel.mode()==='ko'?'':rawGuide.graphs[i].en}</p><p class="ko-explain">${window.SSContentModel.mode()==='en'?'':rawGuide.graphs[i].ko}</p></div>`).join('')}</div><p class="guide-check"><strong>Interpretation checkpoint / 해석 점검:</strong> ${d.check}</p>`);
}
