 function hide(st){st.tip.style.display='none';st.v.style.display='none';st.h.style.display='none';st.dot.style.display='none';st.lastX=null}

  for(const p of data||[]){if(!p||!Number.isFinite(p[0])||!Number.isFinite(p[1])||p[0]<xmin-1e-9||p[0]>xmax+1e-9)continue;const delta=Math.abs(p[0]-x);if(delta<bestDelta){bestDelta=delta;best=p}}

 function readSeries(st,x,y){const d=st.d;const values=[];

   const s=d.series[i];let v=null,sx=x,method='formula';

     const extra=v.method==='formula'?'':` @ x=${fmt(v.x)}`;

{id:'bridge',short:'From Fourier Series to CTFT',section:'§4.1',title:'From Fourier Series to CTFT / 선에서 연속 스펙트럼으로',desc:'Increase the repetition period of one pulse. Harmonic frequency spacing shrinks, but Fourier-series coefficients are not the CTFT heights. / 주기가 커질수록 조화 주파수 간격이 줄어듭니다.',formula:'ω<sub>k</sub> = k(2π/T), &nbsp; T a<sub>k</sub> = X(jω<sub>k</sub>), &nbsp; Δω=2π/T',defaults:{T:'4',tau:1},controls:[{key:'T',label:'Repetition period T / 반복 주기',type:'select',options:[['2','2 s'],['4','4 s'],['8','8 s'],['16','16 s'],['32','32 s']]},{key:'tau',label:'Pulse width τ / 펄스 폭',type:'range',min:.5,max:1.5,step:.25,unit:' s'}],plots:[['Periodic extensions / 반복 펄스','Copies separate as the period grows'],['Samples of the CTFT / 연속 스펙트럼 표본','Stems represent T aₖ, NOT aₖ']],metrics:['Harmonic spacing Δω','FS DC coefficient a₀','Scaled DC value T a₀'],question:'Why must the displayed stems use T aₖ rather than aₖ?',questionKo:'주기 T를 늘릴 때 Fourier Series 계수 aₖ를 그대로 그래프로 그리면 왜 잘못된 비교가 되나요?',answer:'For a non-overlapping periodic extension, aₖ = X(jkω₀)/T. Thus T aₖ samples the same continuous CTFT curve; aₖ itself shrinks with T. / CTFT와 직접 비교할 값은 T aₖ입니다.',draw(s){const T=Number(s.T),tau=s.tau;paintGraph('plot0',{x:[-12,12],y:[-.15,1.3],xstep:4,bands:[{x0:-tau/2,x1:tau/2,color:'rgba(14,132,145,.07)'}],axisnote:'Fixed time view: −12 to +12 s. As T increases, repeated pulses move apart; the central pulse stays put. / T 변경에도 시간축은 일정합니다.',xlabel:'time t (s)',ylabel:'xₜ(t)',series:[{data:sample(-12,12,1400,t=>pulseTrain(t,T,tau)),color:C.teal,label:'periodic pulse train'}]});const stems=[];for(let k=-Math.ceil(10*T/TAU);k<=Math.ceil(10*T/TAU);k++){const w=k*TAU/T;if(Math.abs(w)<=12)stems.push([w,rectFT(w,tau)])}paintGraph('plot1',{x:[-12,12],y:[-.5,1.8],xstep:4,ystep:.5,axisnote:'Fixed ω-axis and amplitude scale: the frequency grid becomes denser as T increases. / Δω = 2π/T를 비교하세요.',xlabel:'angular frequency ω (rad/s)',ylabel:'signed X(jω)',series:[{data:sample(-12,12,700,w=>rectFT(w,tau)),color:C.ink,label:'continuous CTFT'},{data:stems,color:C.coral,type:'stem',label:'T aₖ (scaled FS)'}]});setMetrics([[`${fmt(TAU/T)} rad/s`,'spacing decreases with T'],[fmt(tau/T),'pulse area / period'],[fmt(tau),'pulse area = X(j0)']]);setInsight('The FS-to-FT limit involves both a finer frequency grid and the scaling T aₖ. The synthesis sum becomes an integral as Δω→0. / 간격만 좁아지는 것이 아니라 계수와 주기의 정규화도 함께 필요합니다.')}} ,
{id:'rect',short:'Rectangular Pulse & Sinc',section:'§4.2',title:'Rectangular Pulse and Signed Sinc / 펄스와 sinc',desc:'The pulse duration controls spectral zeros and width. / 시간 폭과 주파수 폭의 역관계를 관찰합니다.',formula:'x(t)=A rect(t/τ), &nbsp; X(jω)=Aτ sinc(ωτ/2)',defaults:{tau:2,A:1},controls:[{key:'tau',label:'Pulse width τ / 폭',type:'range',min:.5,max:4,step:.25,unit:' s'},{key:'A',label:'Amplitude A / 높이',type:'range',min:.5,max:2,step:.25}],plots:[['Time-domain pulse / 시간 신호','Unit-height region is centered at t=0'],['Signed CTFT / 부호 있는 스펙트럼','Negative sidelobes are below the horizontal axis']],metrics:['DC X(j0)','First positive spectral zero','Time-frequency trade-off'],question:'Does doubling τ make the main lobe wider or narrower?',questionKo:'높이를 유지한 채 펄스 폭을 2배로 늘리면 spectrum의 main lobe는 어떻게 되나요?',answer:'The first spectral zero moves from 2π/τ to π/τ; the main lobe becomes half as wide. DC increases proportionally to pulse area Aτ. / 시간 폭이 커지면 스펙트럼은 좁아집니다.',draw(s){const tau=s.tau,A=s.A,wd=TAU/tau;paintGraph('plot0',{x:[-4,4],y:[-.15,2.6],xstep:1,ystep:.5,axisnote:'Fixed time and amplitude axes; changing τ widens the pulse rather than rescaling the plot. / 펄스 폭을 비교하세요.',xlabel:'time t (s)',ylabel:'x(t)',series:[{data:sample(-4,4,1200,t=>A*rect(t,tau)),color:C.teal,label:'rectangular pulse'}]});paintGraph('plot1',{x:[-14,14],y:[-2.6,9.2],xstep:4,ystep:2,axisnote:'Same ω-scale and amplitude axis for every τ and A. DC equals pulse area Aτ; zeros move as τ changes. / 첫 영점과 DC를 확인하세요.',xlabel:'angular frequency ω (rad/s)',ylabel:'X(jω), signed',series:[{data:sample(-14,14,850,w=>rectFT(w,tau,A)),color:C.coral,label:'signed sinc'}],vlines:[{x:wd,color:C.gray,label:'first positive zero'}]});setMetrics([[fmt(A*tau),'area ∫x(t)dt'],[`${fmt(wd)} rad/s`,'ω₀ = 2π/τ'],[`${fmt(tau)} × ${fmt(wd)} ≈ 2π`,'pulse width × first-zero frequency']]);setInsight('Real-even x(t) has a real-even CTFT. Do not confuse the signed spectrum X(jω) with its nonnegative magnitude |X(jω)|. / 음의 sidelobe와 크기 스펙트럼을 구분하세요.')}} ,
{id:'exp',short:'Even Exponential Spectrum',section:'§4.2',title:'Exponential Decay and Spectrum / 지수 감쇠',desc:'Compare time-domain decay with the width of a smooth positive spectrum. / 감쇠율 변화가 스펙트럼의 폭을 바꿉니다.',formula:'x(t)=e<sup>−α|t|</sup>, &nbsp; X(jω)=2α/(α²+ω²), &nbsp; α&gt;0',defaults:{a:1},controls:[{key:'a',label:'Decay rate α / 감쇠율',type:'range',min:.25,max:3,step:.25,unit:' s⁻¹'}],plots:[['Time waveform / 시간 파형','Real, even, two-sided exponential'],['CTFT magnitude / 스펙트럼 크기','Positive, real and even spectrum']],metrics:['DC X(j0)','Magnitude at ω=α','Area under x(t)'],question:'Why does larger α give a broader spectrum but a lower DC value?',questionKo:'α가 증가하면 시간 신호는 더 빨리 감쇠하는데 왜 주파수 스펙트럼의 폭은 커질까요?',answer:'Increasing α narrows the pulse in time. X(jω)=2α/(α²+ω²) has half-maximum at |ω|=α; its DC 2/α decreases. / 빠른 감쇠는 넓은 주파수 분포와 연결됩니다.',draw(s){const a=s.a;paintGraph('plot0',{x:[-7,7],y:[-.1,1.22],xstep:2,axisnote:'Fixed time view: −7 to +7 s. A larger α creates a narrower signal. / 감쇠율을 변경해 폭을 비교하세요.',xlabel:'time t (s)',ylabel:'x(t)',series:[{data:sample(-7,7,700,t=>Math.exp(-a*Math.abs(t))),color:C.teal,label:'e^{−α|t|}'}]});paintGraph('plot1',{x:[-10,10],y:[0,Math.max(1,2/a*1.12)],xstep:2,axisnote:'Fixed ω-axis. Vertical scale adapts to X(0)=2/α so the spectral width remains visible. / y축 높이는 자동 조절됩니다.',xlabel:'angular frequency ω (rad/s)',ylabel:'X(jω)',series:[{data:sample(-10,10,700,w=>2*a/(a*a+w*w)),color:C.coral,label:'2α/(α²+ω²)'}]});setMetrics([[fmt(2/a),'X(0)=2/α'],[fmt(1/a),'X(α)=1/α'],[fmt(2/a),'∫x(t)dt']]);setInsight('Time localization and frequency spread are connected, but the exact mathematical trade-off depends on the signal family. / 감쇠하는 시간 신호와 넓어지는 주파수 분포를 관찰하세요.')}} ,
{id:'shiftScale',short:'Time Shift & Scaling',section:'§4.3',title:'Shift, Width and Phase / 이동·폭·위상',desc:'Move a rectangular pulse and change its width to observe magnitude and phase separately. / 시간 이동과 시간 스케일링의 차이를 확인합니다.',formula:'rect[(t−t<sub>0</sub>)/τ] ↔ e<sup>−jωt<sub>0</sub></sup> τ sinc(ωτ/2)',defaults:{tau:1.5,t0:1},controls:[{key:'tau',label:'Pulse width τ / 폭',type:'range',min:.5,max:3,step:.25,unit:' s'},{key:'t0',label:'Time shift t₀ / 이동',type:'range',min:-2,max:2,step:.25,unit:' s'}],plots:[['Shifted waveform / 이동된 파형','Gray = centered pulse; teal = delayed/advanced'],['Magnitude |X| / 크기 스펙트럼','Independent of time shift'],['Shift-induced phase / 이동에 의한 위상','−ωt₀: not the full phase at negative sinc lobes']],metrics:['Pulse area X(j0)','First positive zero','Phase slope from shift'],question:'Which property changes the spectral width, and which changes the phase?',questionKo:'펄스의 폭과 위치를 조절할 때 스펙트럼 크기·위상이 각각 어떻게 변하나요?',answer:'Width τ changes the sinc envelope and zeros. Shift t₀ multiplies the CTFT by e^{−jωt₀}: its magnitude stays unchanged, while the additional phase is −ωt₀. At signed-sinc negative lobes the full phase includes π. / 위상 그래프는 시간 이동에 의한 추가 위상만 표시합니다.',draw(s){const tau=s.tau,t0=s.t0;paintGraph('plot0',{x:[-4,4],y:[-.15,1.3],axisnote:'Fixed time view: −4 to +4 s. Compare both the original and shifted pulses. / 이동 전·후를 같은 시간축에서 비교하세요.',xlabel:'time t (s)',ylabel:'x(t)',series:[{data:sample(-4,4,950,t=>rect(t,tau)),color:C.gray,dash:true,label:'centered'},{data:sample(-4,4,950,t=>rect(t-t0,tau)),color:C.teal,label:'shifted'}]});paintGraph('plot1',{x:[-12,12],y:[0,3.6],ystep:1,axisnote:'Fixed frequency and magnitude scale. A time shift changes phase but not this magnitude. / 시간 이동에 따른 크기 불변을 확인하세요.',xlabel:'ω (rad/s)',ylabel:'|X(jω)|',series:[{data:sample(-12,12,650,w=>Math.abs(rectFT(w,tau))),color:C.coral,label:'|τ sinc(ωτ/2)|'}]});paintGraph('plot2',{x:[-10,10],y:[-21,21],xstep:5,ystep:10,axisnote:'Fixed ω/phase axes. Phase slope = −t₀; compare the sign of the shift. / 기울기를 해석하세요.',xlabel:'ω (rad/s)',ylabel:'additional phase (rad)',series:[{data:sample(-10,10,400,w=>-w*t0),color:C.purple,label:'−ωt₀'}]});setMetrics([[fmt(tau),'∫x(t)dt'],[`${fmt(TAU/tau)} rad/s`,'2π/τ'],[`${fmt(-t0)} s`,'d(Δphase)/dω=−t₀']]);setInsight('The difference between magnitude and phase is essential: delaying x(t) does NOT alter |X(jω)|. / 주파수영역 크기와 위상을 분리해 해석합니다.')}} ,
{id:'signed',short:'Signed Spectrum vs Magnitude',section:'§4.4',title:'Signed X(jω) versus |X(jω)| / 스펙트럼 읽기',desc:'A negative spectrum does not imply negative magnitude; it changes phase by π. / 실수 음수 스펙트럼과 양수 magnitude를 비교합니다.',formula:'X(jω)=τ sinc(ωτ/2), &nbsp; |X(jω)|≥0',defaults:{tau:2},controls:[{key:'tau',label:'Pulse width τ / 폭',type:'range',min:.75,max:4,step:.25,unit:' s'}],plots:[['Signed spectrum / 부호 있는 스펙트럼','Real-valued CTFT with positive and negative lobes'],['Magnitude spectrum / 크기 스펙트럼','Absolute values fold negative lobes upward']],metrics:['X(j0)','First spectral zero','Sign/phase relationship'],question:'At a negative sidelobe, is the magnitude negative?',questionKo:'부호가 음수인 sidelobe에서 magnitude도 음수가 되나요?',answer:'No. Magnitude |X| is nonnegative. A negative real X(jω) has phase ±π (away from zeros), but |X| stays positive. At exact zeros, phase is undefined. / 음수 값과 크기 절댓값을 구분하세요.',draw(s){const tau=s.tau,max=Math.max(1,tau);paintGraph('plot0',{x:[-14,14],y:[-1.2,4.7],xstep:4,ystep:1,axisnote:'Fixed ω and vertical axes: negative sidelobes stay below zero. / 부호가 음수인 영역을 확인하세요.',xlabel:'ω (rad/s)',ylabel:'X(jω)',series:[{data:sample(-14,14,850,w=>rectFT(w,tau)),color:C.coral,label:'signed X'}]});paintGraph('plot1',{x:[-14,14],y:[0,4.7],xstep:4,ystep:1,axisnote:'Same scale as the signed spectrum. Magnitude removes the negative sign. / 동일한 눈금에서 비교하세요.',xlabel:'ω (rad/s)',ylabel:'|X(jω)|',series:[{data:sample(-14,14,850,w=>Math.abs(rectFT(w,tau))),color:C.teal,label:'magnitude |X|'}]});setMetrics([[fmt(tau),'area of pulse'],[`${fmt(TAU/tau)} rad/s`,'first zero'],['negative real X → ±π','phase at nonzero negative lobes']]);setInsight('A signed real spectrum contains phase information through its sign. Magnitude plots suppress that sign and must be paired with phase for full reconstruction. / 크기만 보면 음수 부호에 포함된 위상 정보를 잃습니다.')}} ,
{id:'rc',short:'RC Low-Pass Frequency Response',section:'§4.5',title:'Convolution and RC Lowpass / 필터의 시간·주파수',desc:'Observe smoothing of a causal rectangular pulse without evaluating a convolution integral from scratch. / RC 필터에 의해 펄스의 시작과 끝이 완만해집니다.',formula:'Y(jω)=H(jω)X(jω), &nbsp; H(jω)=1/(1+jωτ)',defaults:{tau:.7,D:2},controls:[{key:'tau',label:'RC time constant τ / 시정수',type:'range',min:.2,max:2,step:.1,unit:' s'},{key:'D',label:'Input pulse duration D / 펄스 길이',type:'range',min:1,max:4,step:.25,unit:' s'}],plots:[['Pulse response / 시간영역 입출력','x(t)=u(t)−u(t−D); zero-state RC output'],['Magnitude CTFT / 주파수영역','Input |X| and attenuated output |Y|']],metrics:['Cutoff ωc','Peak output at t=D','Magnitude gain at cutoff'],question:'Why does the output keep decaying after the input pulse ends?',questionKo:'입력 펄스가 0이 된 후에도 출력이 즉시 0이 되지 않는 이유는 무엇인가요?',answer:'The RC system stores energy and its impulse response has an exponential tail. For t>D, y(t)=(1−e^{−D/τ})e^{−(t−D)/τ}. / 시스템의 기억 효과가 출력의 지수 감쇠 꼬리를 만듭니다.',draw(s){const tau=s.tau,D=s.D,output=t=>t<0?0:t<D?1-Math.exp(-t/tau):(1-Math.exp(-D/tau))*Math.exp(-(t-D)/tau);paintGraph('plot0',{x:[-2,14],y:[-.12,1.2],xstep:2,axisnote:'Fixed time view: −2 to +14 s for all τ and D. Pulse end is marked at t=D. / 입력 종료와 출력 감쇠를 비교하세요.',vlines:[{x:D,color:C.gold,label:'pulse end t=D'}],xlabel:'time t (s)',ylabel:'amplitude',series:[{data:sample(-2,14,1100,t=>t>=0&&t<D?1:0),color:C.gray,dash:true,label:'input pulse x(t)'},{data:sample(-2,14,1100,output),color:C.teal,label:'RC output y(t)'}]});paintGraph('plot1',{x:[-12,12],y:[0,4.8],xstep:4,ystep:1,axisnote:'Fixed ω-axis and magnitude scale: RC filtering reduces |Y| relative to |X|. / 같은 눈금에서 출력 감쇠를 비교하세요.',xlabel:'ω (rad/s)',ylabel:'|X|, |Y|',series:[{data:sample(-12,12,900,w=>Math.abs(rectFT(w,D))),color:C.gray,dash:true,label:'input |X|'},{data:sample(-12,12,900,w=>Math.abs(rectFT(w,D))/Math.hypot(1,w*tau)),color:C.coral,label:'output |Y|'}]});setMetrics([[`${fmt(1/tau)} rad/s`,'ωc=1/τ'],[fmt(1-Math.exp(-D/tau)),'1−e^{−D/τ}'],[fmt(1/Math.sqrt(2)),'−3 dB / 0.7071']]);setInsight('CTFT turns convolution into multiplication, Y=HX. The result is valid for this LTI zero-state RC filter. / 주파수응답이 높은 주파수를 줄이기 때문에 시간영역의 급격한 변화가 완화됩니다.')}} ,
{id:'mod',short:'Cosine Modulation',section:'§4.6',title:'Modulation and Spectral Copies / 변조와 이동',desc:'Cosine multiplication creates two shifted copies of the baseband spectrum. / 코사인 변조로 양·음 주파수에 복사본이 생깁니다.',formula:'x(t)cos(ω<sub>c</sub>t) ↔ ½[X(j(ω−ω<sub>c</sub>))+X(j(ω+ω<sub>c</sub>))]',defaults:{wc:6,tau:2},controls:[{key:'wc',label:'Carrier ωc / 반송파',type:'range',min:1,max:11,step:.5,unit:' rad/s'},{key:'tau',label:'Pulse width τ / 폭',type:'range',min:.75,max:3,step:.25,unit:' s'}],plots:[['Modulated pulse / 변조된 시간 신호','Rectangular envelope times cosine'],['Shifted spectrum / 이동한 스펙트럼','Signed real CTFT; copies may overlap and add']],metrics:['Carrier frequency','Unmodulated DC X(0)','Modulated spectrum at ω=0'],question:'Why are there two copies rather than only one?',questionKo:'cos(ωct)를 곱하면 주파수영역에 왜 두 복사본이 생기나요?',answer:'cos(ωct)=(e^{jωct}+e^{−jωct})/2. Multiplication by the two complex exponentials shifts X by +ωc and −ωc, each with factor 1/2. / Euler 식의 두 복소 지수 항이 ±ωc 이동을 만듭니다.',draw(s){const tau=s.tau,wc=s.wc,F=w=>.5*(rectFT(w-wc,tau)+rectFT(w+wc,tau));paintGraph('plot0',{x:[-4,4],y:[-1.2,1.2],axisnote:'Fixed time view: −4 to +4 s. A higher carrier ωc increases oscillation count inside the pulse. / 동일 시간축에서 진동 수를 비교하세요.',xlabel:'time t (s)',ylabel:'x(t)',series:[{data:sample(-4,4,1000,t=>rect(t,tau)*Math.cos(wc*t)),color:C.teal,label:'modulated pulse'}]});paintGraph('plot1',{x:[-18,18],y:[-1.4,3.6],xstep:6,ystep:1,axisnote:'Fixed frequency scale: spectral copies move toward ±ωc. / 두 복사본의 위치를 비교하세요.',xlabel:'ω (rad/s)',ylabel:'signed Xmod(jω)',series:[{data:sample(-18,18,1000,F),color:C.coral,label:'two-copy sum'}],vlines:[{x:wc,color:C.gray,label:'carrier +ωc'},{x:-wc,color:C.gray,label:'carrier −ωc'}]});setMetrics([[`${fmt(wc)} rad/s`,'carrier shift ±ωc'],[fmt(tau),'area of base pulse'],[fmt(F(0)),'sum of two shifted copies at DC']]);setInsight('The two shifted spectra combine algebraically (with signs and phases); they can overlap and cancel or reinforce. / 주파수 이동 후 단순히 크기를 더하는 것이 아니라 복소 스펙트럼을 합합니다.')}} ,
{id:'numeric',short:'Numerical CTFT Approximation',section:'§4.7',title:'Numerical CTFT from Samples / 적분의 수치 근사',desc:'Sample a finite observation window and compare a Riemann-sum approximation against the analytic CTFT. / 유한 관측과 샘플 간격이 만드는 오차를 확인합니다.',formula:'X̂(jω)≈Δt Σ<sub>n=−M</sub><sup>M</sup> x(nΔt)e<sup>−jωnΔt</sup>, &nbsp; x(t)=e<sup>−|t|</sup>',defaults:{dt:.25,T:4},controls:[{key:'dt',label:'Sample interval Δt / 표본 간격',type:'range',min:.05,max:.5,step:.05,unit:' s'},{key:'T',label:'Observation half-width T / 관측 범위 ±T',type:'range',min:2,max:8,step:.5,unit:' s'}],plots:[['Observed samples / 관측 표본','Samples of e^{−|t|} over −T≤t≤T'],['Analytic vs numerical CTFT / 변환 비교','Re{X̂} on |ω|≤10; reference 2/(1+ω²)']],metrics:['Samples in record','Absolute DC approximation error','Sampling Nyquist angular frequency'],question:'Does zero-padding or smaller Δt correct the finite observation truncation?',questionKo:'샘플 간격 Δt를 줄이거나 zero padding만 하면 유한 관측 구간 밖의 정보를 복원할 수 있나요?',answer:'No. Smaller Δt improves integration sampling, but finite observation ±T still omits exponential tails. Increasing T reduces truncation error. FFT can compute discrete frequency samples efficiently but is not itself an exact continuous CTFT. / 샘플링 오차와 관측 구간 절단 오차를 구분해야 합니다.',draw(s){const dt=s.dt,T=s.T,M=Math.floor(T/dt),points=[],reSum=w=>{let r=0;for(let n=-M;n<=M;n++){const t=n*dt;r+=Math.exp(-Math.abs(t))*Math.cos(w*t)*dt}return r};for(let n=-M;n<=M;n++){const t=n*dt;points.push([t,Math.exp(-Math.abs(t))])}paintGraph('plot0',{x:[-8.5,8.5],y:[-.08,1.19],xstep:2,bands:[{x0:-T,x1:T,color:'rgba(14,132,145,.06)'}],vlines:[{x:-T,color:C.gold,label:'−T observation boundary'},{x:T,color:C.gold,label:'+T observation boundary'}],axisnote:'Fixed t-axis: −8.5 to +8.5 s; markers ±T show the observation window. / T 변경시 표본 범위만 바뀝니다.',xlabel:'time t (s)',ylabel:'x(nΔt)',series:[{data:points,color:C.teal,type:'stem',radius:2.4,label:'observed samples'}]});paintGraph('plot1',{x:[-10,10],y:[-.12,2.4],xstep:4,axisnote:'Fixed ω/height scale: compare the theoretical CTFT with a truncated numerical approximation. / 계산 오차를 동일 축에서 확인하세요.',xlabel:'angular frequency ω (rad/s)',ylabel:'Re{X(jω)}',series:[{data:sample(-10,10,750,w=>2/(1+w*w)),color:C.gray,dash:true,label:'analytic 2/(1+ω²)'},{data:sample(-10,10,280,reSum),color:C.coral,label:'finite numerical sum'}]});setMetrics([[`${2*M+1}`,'N = 2floor(T/Δt)+1'],[fmt(Math.abs(reSum(0)-2)),'|X̂(0)−2|'],[`${fmt(PI/dt)} rad/s`,'π/Δt (discrete sampling limit)']]);setInsight('This finite sum may show sampling and truncation errors. FFT accelerates a grid of sums; it does not bypass the assumptions needed to approximate a CTFT. / 적분의 수치 근사를 검증하고 aliasing·관측 길이의 영향을 구분하세요.')}}
];
// Bilingual, control-linked derivations: English terminology first, Korean explanation second.
const item=(head,math,ko)=>({head,math,ko});
const plotNote=(title,en,ko)=>({title,en,ko});
// Shared bilingual learning UI, invoked from each lab's numeric update loop.
const guideItem=(head,math,ko)=>({head,math,ko});
const guidePlot=(title,en,ko)=>({title,en,ko});
const guideView={count:{},previous:{},timer:null,playing:false,duration:2600,lastModule:null};
function stopGuidePlay(){if(guideView.timer!==null){clearInterval(guideView.timer);guideView.timer=null}guideView.playing=false}
function revealGuide(moduleId,state,guideFactory){
 const pane=document.getElementById('derivationPanel'),rp=document.getElementById('readingPanel');if(!pane||!rp)return;
 const rawGuide=guideFactory(state),d=window.SSContentModel.model(rawGuide),total=d.steps.length;
 const n=Math.max(1,Math.min(total,guideView.count[moduleId]||1));
 const animate=guideView.previous[moduleId]!==undefined&&n>guideView.previous[moduleId]&&n===guideView.previous[moduleId]+1;
 const displayStep=(v,i)=>`<article class="deriv-step ${animate&&i===n-1?'guide-enter':''}" aria-label="Step ${i+1} of ${total}"><div class="deriv-top"><span class="step-index">${i+1}</span><strong>${v.head}</strong></div><div class="deriv-math">${v.math}</div><p>${v.ko}</p></article>`;
 pane.innerHTML=window.SSContentModel.html(`<div class="guide-head"><div><div class="overlabel">GUIDED DERIVATION / 단계별 수식 유도</div><h3>Equation → Derivation → Meaning / 수식 유도와 의미</h3><p>Adjust a variable to update the equations. / 변수를 변경하면 아래 수식도 갱신됩니다.</p></div><span class="progress-badge" role="status">Step ${n} / ${total}</span></div><div class="guide-track" role="progressbar" aria-valuemin="1" aria-valuemax="${total}" aria-valuenow="${n}" aria-label="Derivation progress"><div style="width:${100*n/total}%"></div></div><div class="guide-steps">${d.steps.slice(0,n).map(displayStep).join('')}</div><div class="guide-actions"><button id="previousStep" type="button" ${n<=1?'disabled':''}>◀ Previous / 이전</button><button id="nextStep" type="button" ${n>=total?'disabled':''}>Next step / 다음 ▶</button><button id="guidePlay" type="button" class="primary" aria-pressed="${guideView.playing}">${guideView.playing?'Pause animation / 일시정지':'▶ Play animation / 자동 전개'}</button><button id="allSteps" type="button">${n===total?'Restart / 처음부터':'Show all / 전체 보기'}</button></div>`);
 const change=next=>{guideView.count[moduleId]=Math.max(1,Math.min(total,next));revealGuide(moduleId,state,guideFactory)};
 pane.querySelector('#previousStep').onclick=()=>{stopGuidePlay();change(n-1)};
 pane.querySelector('#nextStep').onclick=()=>{stopGuidePlay();change(n+1)};
 pane.querySelector('#allSteps').onclick=()=>{stopGuidePlay();change(n===total?1:total)};
 pane.querySelector('#guidePlay').onclick=()=>{
  if(guideView.playing){stopGuidePlay();revealGuide(moduleId,state,guideFactory);return}
  if(n===total)guideView.count[moduleId]=1;
  guideView.playing=true;
  revealGuide(moduleId,state,guideFactory);
  guideView.timer=setInterval(()=>{
   if(currentGuidedId()!==moduleId){stopGuidePlay();return}
   const now=guideView.count[moduleId]||1;
   if(now>=total){stopGuidePlay();revealGuide(moduleId,currentGuidedState(moduleId),guideFactory);return}
   guideView.count[moduleId]=now+1;
   revealGuide(moduleId,currentGuidedState(moduleId),guideFactory);
   if(now+1>=total){stopGuidePlay();const b=pane.querySelector('#guidePlay');if(b){b.textContent='▶ Play animation / 자동 전개';b.setAttribute('aria-pressed','false')}}
  },guideView.duration)
 };
 guideView.previous[moduleId]=n;
 rp.innerHTML=window.SSContentModel.html(`<div class="overlabel">READ THE GRAPHS / 그래프 해석</div><h3>What changed, and why? / 무엇이 왜 바뀌었을까요?</h3><div class="reading-grid">${d.graphs.map((v,i)=>`<div class="reading-note"><span class="plot-number">GRAPH ${String(i+1).padStart(2,'0')}</span><strong>${v.title}</strong><p>${window.SSContentModel.mode()==='ko'?'':rawGuide.graphs[i].en}</p><p class="ko-explain">${window.SSContentModel.mode()==='en'?'':rawGuide.graphs[i].ko}</p></div>`).join('')}</div><p class="guide-check"><strong>Interpretation checkpoint / 해석 점검:</strong> ${d.check}</p>`);
}

 }},
 rect:s=>{const zero=TAU/s.tau;return{

 item('Write the CTFT integral / CTFT 정의 적용','X(jω)=∫<sub>−∞</sub><sup>∞</sup>x(t)e<sup>−jωt</sup>dt = A∫<sub>−τ/2</sub><sup>τ/2</sup>e<sup>−jωt</sup>dt','펄스 바깥에서는 0이므로 적분 구간을 펄스 폭으로 줄입니다.'),
 item('Evaluate the exponential / 지수 적분','X(jω)=A[2sin(ωτ/2)/ω] = Aτ sinc(ωτ/2)','오일러 관계와 적분 상·하한을 이용하면 부호를 가진 실수 sinc 스펙트럼이 됩니다.'),
 item('Check area and first zeros / 면적과 영점 검산','X(j0)=Aτ='+fmt(s.A*s.tau)+'; &nbsp; first zeros: ω=±2π/τ=±'+fmt(zero)+' rad/s','DC 값은 펄스 면적과 같습니다. 폭이 커지면 스펙트럼의 첫 영점은 원점에 가까워집니다.')],
 graphs:[plotNote('Time pulse / 시간 신호','The rectangular pulse widens as τ increases; changing A scales height.','펄스 폭과 높이를 별도로 움직여 면적의 변화를 확인합니다.'),plotNote('Signed sinc / 부호 있는 sinc','Negative sidelobes are real negative values, not negative magnitudes.','0 아래 곡선은 음의 실수 변환값입니다. |X|는 별도로 절댓값을 취해야 합니다.')],

 }},
 exp:s=>{const a=s.a;return{

 graphs:[plotNote('Time-domain decay / 시간 감쇠','Large α makes x(t) decrease faster on both sides of t=0.','t가 ±방향으로 커질 때 신호 크기가 빨리 작아지는지 확인합니다.'),plotNote('Positive even CTFT / 실수 짝대칭 스펙트럼','X(jω) is symmetric and nonnegative; its DC height varies inversely with α.','주파수축 원점 높이는 2/α입니다. 시간 폭과 주파수 폭의 관계를 함께 읽습니다.')],

 }},
 shiftScale:s=>{const zero=TAU/s.tau;return{

 item('Substitute in the integral / 치환을 통한 유도','X(jω)=e<sup>−jωt₀</sup>P(jω)=e<sup>−jωt₀</sup>τ sinc(ωτ/2)','u=t−t₀로 치환하면 e^(−jωt₀)인 위상 인자만 새롭게 곱해집니다.'),
 item('Separate magnitude and phase / 크기와 위상','|X(jω)|=τ|sinc(ωτ/2)|; &nbsp; Δ∠X=−ωt₀; &nbsp; first zero=±'+fmt(zero),'이동은 magnitude를 바꾸지 않습니다. 표기한 −ωt₀는 추가 위상이며 음의 sinc lobe 자체의 π 위상은 별도입니다.')],

 item('Check numerical and sampling limits / 근사 오차와 주파수','X(j0)=2, &nbsp; X̂(j0)=Δt Σ e<sup>−|nΔt|</sup>, &nbsp; π/Δt='+fmt(PI/s.dt)+' rad/s','Δt를 줄이면 수치 적분이 개선될 수 있지만, 관측 구간을 늘리지 않으면 절단 오차는 여전히 남습니다.')],

 }}
