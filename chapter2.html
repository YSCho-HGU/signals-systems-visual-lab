body{font-family:system-ui,-apple-system,'Malgun Gothic','Apple SD Gothic Neo',Arial,sans-serif;background:#f3f7f9;color:#173046}
.figure,.metric,.controls,.panel,.derivation-panel,.reading-panel,.learning,.question,.insight,.quiz{border-radius:16px!important;box-shadow:0 5px 18px #15374a08!important;border-color:#dce6ec!important}
.derivation-panel,.reading-panel{padding:20px!important}
.guide-head h3,.reading-panel h3{color:#173046!important;font-size:18px!important;line-height:1.4!important}
.deriv-math{font-family:Cambria,'Times New Roman',serif!important;line-height:1.55!important;overflow-wrap:anywhere}
.deriv-step{border-radius:12px!important;overflow-wrap:anywhere}
.guide-actions{gap:8px!important}
.guide-actions button{font-family:system-ui,'Malgun Gothic',sans-serif!important;font-weight:700!important;font-size:12px!important;border-radius:10px!important;min-height:37px}
.guide-actions button.primary{background:#0e8491!important;color:white!important;border-color:#0e8491!important}
.guide-track{border-radius:100px!important;overflow:hidden}
.guide-track>div{background:linear-gradient(90deg,#0e8491,#49bcb3)!important}
.figure h3{color:#173046!important;font-weight:750!important}
.figure canvas{display:block;max-width:100%}
.figure p,.reading-panel p,.guide-head p{line-height:1.65}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #e2ae3e!important;outline-offset:2px!important}



@media(max-width:750px){.derivation-panel,.reading-panel{padding:15px!important}}
@media(prefers-reduced-motion:reduce){.deriv-step{animation:none!important}}

.ss-hover-tip .ss-hover-title{font-weight:800;color:#adf2f2;font-size:12px;margin-bottom:4px}
.ss-hover-tip .ss-hover-coord{color:#e1f4fb;font-size:11px;margin-bottom:5px}
.ss-hover-tip .ss-hover-line{display:flex;align-items:baseline;gap:7px;margin:3px 0;color:#f1fbff}
.ss-hover-tip .ss-hover-swatch{display:inline-block;width:8px;height:8px;flex:0 0 8px;border-radius:50%;background:var(--ss-line,#6ccbd0)}
.ss-hover-tip .ss-hover-line b{font-weight:750;color:#fff}

.ss-hover-v,.ss-hover-h{position:absolute;display:none;pointer-events:none;z-index:30;background:#e26b4f;opacity:.85}
.ss-hover-v{width:1px;border-left:1px dashed #f18b63;background:transparent}

.ss-hover-dot{position:absolute;display:none;pointer-events:none;z-index:31;width:11px;height:11px;border-radius:50%;border:2px solid #fff;background:#ed7954;box-shadow:0 0 0 1px #123a4e;transform:translate(-50%,-50%)}

{id:'ctexp',short:'Convolution of Exponentials',section:'§2.3.2',title:'Convolution of Two Causal Exponentials / 인과 지수함수의 컨벌루션',desc:'Inspect the integrand and compare the analytic result with the time-domain output. / 적분구간과 응답의 시작값을 확인하세요.',formula:'e<sup>−at</sup>u(t) * e<sup>−bt</sup>u(t) = (e<sup>−at</sup>−e<sup>−bt</sup>)/(b−a) ·u(t), &nbsp; a≠b',defaults:{t:1.5,a:.8,b:1.6},controls:[{key:'t',label:'Selected time t / 관찰 시각',type:'range',min:0,max:7,step:.1,unit:' s'},{key:'a',label:'Input decay a / 입력 감쇠',type:'range',min:.4,max:2.4,step:.2,unit:' 1/s'},{key:'b',label:'System decay b / 시스템 감쇠',type:'range',min:.4,max:2.4,step:.2,unit:' 1/s'}],plots:[['Two causal signals / 두 인과 신호','x(t)=e^(−at)u(t), h(t)=e^(−bt)u(t)'],['Integrand at selected t / 적분 함수','x(τ)h(t−τ), nonzero only for 0≤τ≤t'],['Convolution result / 출력','Analytic solution and the selected point']],metrics:['Current y(t)','Integration interval','Value at t=0'],question:'Why is y(0)=0 even though x(0) and h(0) can be nonzero?',questionKo:'두 신호가 t=0에서 1이어도 컨벌루션 출력 y(0)은 왜 0인가요?',answer:'The overlap interval has zero width at t=0. The value of an ordinary integral over a single point is zero. / t=0에서 적분 구간의 길이가 0입니다.',draw(s){const y=expconv(s.t,s.a,s.b);paintGraph('plot0',{x:[-1,8],y:[-.15,1.25],xstep:1,ystep:.25,axisnote:'Fixed time axis −1…8 s. The exponential signals are causal (zero for t<0).',xlabel:'time t (s)',ylabel:'amplitude',series:[{data:sample(-1,8,1000,t=>ctexp(t,s.a)),color:C.teal,label:'x(t)'},{data:sample(-1,8,1000,t=>ctexp(t,s.b)),color:C.coral,dash:true,label:'h(t)'}]});paintGraph('plot1',{x:[-1,8],y:[-.15,1.1],xstep:1,ystep:.25,bands:s.t>0?[{x0:0,x1:s.t,color:'rgba(14,132,145,.13)'}]:[],axisnote:`At t=${fmt(s.t)}, integrate over 0≤τ≤${fmt(s.t)}. / 그 밖의 곱은 0입니다.`,xlabel:'integration variable τ (s)',ylabel:'integrand',series:[{data:sample(-1,8,1100,u=>u>=0&&u<=s.t?Math.exp(-s.a*u-s.b*(s.t-u)):0),color:C.purple,label:'x(τ)h(t−τ)'}]});paintGraph('plot2',{x:[-1,8],y:[-.1,1.1],xstep:1,ys {id:'rc',short:'RC Low-Pass Pulse Response',section:'§2.3.4',title:'RC Low-Pass Pulse Response / RC 저역통과 응답',desc:'A finite pulse charges the capacitor, then it discharges after the pulse ends. / 펄스 폭과 시정수에 따른 충·방전을 비교하세요.',formula:'h(t)=(1/τ)e<sup>−t/τ</sup>u(t); &nbsp; y(t)=[1−e<sup>−t/τ</sup>]u(t)−[1−e<sup>−(t−T)/τ</sup>]u(t−T)',defaults:{tau:1,T:3},controls:[{key:'tau',label:'RC time constant τ / 시정수',type:'range',min:.2,max:2.4,step:.2,unit:' s'},{key:'T',label:'Pulse duration T / 입력 폭',type:'range',min:.5,max:4.5,step:.5,unit:' s'}],plots:[['Input vs output / 입력·출력','Unit pulse x(t) and capacitor response y(t)'],['Impulse response / 임펄스 응답','h(t)=(1/τ)e^(−t/τ)u(t)'],['Step vs pulse response / 계단·펄스 응답','Difference of two shifted step responses']],metrics:['Value at pulse end y(T)','Step response at t=τ','DC gain ∫h(t)dt'],question:'Does increasing τ make the pulse output rise faster or slower?',questionKo:'시정수 τ를 크게 하면 출력이 더 빨리 상승하나요, 느리게 상승하나요?',answer:'Slower. The step response reaches 1−e^(−1)≈63.2% at t=τ. A finite pulse ends at T and then the capacitor discharges. / τ가 커지면 응답은 더 느려집니다.',draw(s){const tmax=10;paintGraph('plot0',{x:[-1,tmax],y:[-.15,1.35],xstep:2,ystep:.25,axisnote:`Fixed time axis −1…10 s; vertical line marks pulse end T=${fmt(s.T)} s.`,xlabel:'time t (s)',ylabel:'amplitude',vlines:[{x:s.T,color:C.gold,label:'pulse ends T'}],series:[{data:sample(-1,tmax,1300,t=>pulse(t,s.T)),color:C.gray,dash:true,label:'input x(t)'},{data:sample(-1,tmax,1300,t=>rcPulse(t,s.T,s.tau)),color:C.teal,label:'output y(t)'}]});paintGraph('plot1',{x:[-1,tmax],y:[-.2,5.3],xstep:2,ystep:1,axisnote:'Fixed axes; h(0+) = 1/τ. Larger τ spreads the response while preserving its total area.',xlabel:'time t (s)',ylabel:'h(t) (1/s)',series:[{data:sample(-1,tmax,1300,t=>t<0?0:Math.exp(-t/s.tau)/s.tau),color:C.coral,label:'impulse response'}]});paintGraph('plot2',{x:[-1,tmax],y:[-.15,1.35],xstep:2,ystep:.25,axisnote:'Step response reaches 63.2% at t=τ; the pulse response is t  const rawGuide=guideFactory(state),d=window.SSContentModel.model(rawGuide),total=d.steps.length;

 const displayStep=(v,i)=>`<article class="deriv-step ${animate&&i===n-1?'guide-enter':''}" aria-label="Step ${i+1} of ${total}"><div class="deriv-top"><span class="step-index">${i+1}</span><strong>${v.head}</strong></div><div class="deriv-math">${v.math}</div><p>${v.ko}</p></article>`;
 pane.innerHTML=window.SSContentModel.html(`<div class="guide-head"><div><div class="overlabel">GUIDED DERIVATION / 단계별 수식 유도</div><h3>Equation → Derivation → Meaning / 수식 유도와 의미</h3><p>Adjust a variable to update the equations. / 변수를 변경하면 아래 수식도 갱신됩니다.</p></div><span class="progress-badge" role="status">Step ${n} / ${total}</span></div><div class="guide-track" role="progressbar" aria-valuemin="1" aria-valuemax="${total}" aria-valuenow="${n}" aria-label="Derivation progress"><div style="width:${100*n/total}%"></div></div><div class="guide-steps">${d.steps.slice(0,n).map(displayStep).join('')}</div><div class="guide-actions"><button id="previousStep" type="button" ${n<=1?'disabled':''}>◀ Previous / 이전</button><button id="nextStep" type="button" ${n>=total?'disabled':''}>Next step / 다음 ▶</button><button id="guidePlay" type="button" class="primary" aria-pressed="${guideView.playing}">${guideView.playing?'Pause animation / 일시정지':'▶ Play animation / 자동 전개'}</button><button id="allSteps" type="button">${n===total?'Restart / 처음부터':'Show all / 전체 보기'}</button></div>`);
 const change=next=>{guideView.count[moduleId]=Math.max(1,Math.min(total,next));revealGuide(moduleId,state,guideFactory)};
 pane.querySelector('#previousStep').onclick=()=>{stopGuidePlay();change(n-1)};

 pane.querySelector('#guidePlay').onclick=()=>{
  if(guideView.playing){stopGuidePlay();revealGuide(moduleId,state,guideFactory);return}
  if(n===total)guideView.count[moduleId]=1;
  guideView.playing=true;
  revealGuide(moduleId,state,guideFactory);
  guideView.timer=setInterval(()=>{
   if(currentGuidedId()!==moduleId){stopGuidePlay();return}
   const now=guideView.count[moduleId]||1;
   if(now>=total){stopGuidePlay();revealGuide(moduleId,currentGuidedState(moduleId),guideFactory);return}
   guideView.count[moduleId]=now+1;
   revealGuide(moduleId,currentGuidedState(moduleId),guideFactory);
   if(now+1>=total){stopGuidePlay();const b=pane.querySelector('#guidePlay');if(b){b.textContent='▶ Play animation / 자동 전개';b.setAttribute('aria-pressed','false')}}
  },guideView.duration)
 };
 guideView.previous[moduleId]=n;
 rp.innerHTML=window.SSContentModel.html(`<div class="overlabel">READ THE GRAPHS / 그래프 해석</div><h3>What changed, and why? / 무엇이 왜 바뀌었을까요?</h3><div class="reading-grid">${d.graphs.map((v,i)=>`<div class="reading-note"><span class="plot-number">GRAPH ${String(i+1).padStart(2,'0')}</span><strong>${v.title}</strong><p>${window.SSContentModel.mode()==='ko'?'':rawGuide.graphs[i].en}</p><p class="ko-explain">${window.SSContentModel.mode()==='en'?'':rawGuide.graphs[i].ko}</p></div>`).join('')}</div><p class="guide-check"><strong>Interpretation checkpoint / 해석 점검:</strong> ${d.check}</p>`);
}

function motionReset(){cancelMotion();motion.phase=4;motion.progress=1;motion.active=false;motionRedraw()}
function motionMarkup(id){if(!isMotionLab(id))return '';
 return `<section class="motion-panel" id="motionPanel" aria-label="Graphical convolution animation"><div class="overlabel">GRAPHICAL CONVOLUTION ANIMATION / 그래프 동작 애니메이션</div><h3>Watch Flip → Shift → Multiply → ${id==='dtflip'?'Sum':'Integrate'}</h3><p class="motion-lead">Follow the moving impulse response on a fixed axis. / 축은 고정하고 임펄스 응답만 움직이는 모습을 관찰하세요.</p><div class="motion-stages" id="motionStages" aria-label="Five stages"></div><div class="motion-status" id="motionStatus" role="status" aria-live="polite"></div><div class="motion-actions"><button type="button" id="motionPlay" class="motion-primary">▶ Play steps / 단계 재생</button><button type="button" id="motionFirst">↶ Start / 처음</button><button type="button" id="motionPrev">◀ Previous</button><button type="button" id="motionNext">Next ▶</button><button type="button" id="motionSweep">▶ Sweep ${id==='dtflip'?'n':'t'} / 전체 이동</button><button type="button" id="motionReset">↺ Reset view / 초기화</button><label class="motion-speed">Speed <select id="motionSpeed" aria-label="Animation speed"><option value="0.65">Slow</option><option value="1" selected>Normal</option><option value="1.6">Fast</option></select></label></div><p class="motion-caution">${id==='dtflip'?'DT: Positions between integer samples illustrate movement only; convolution is computed at integer n. / 중간 이동 위치는 시각적 표현이며 합산은 정수 n에서만 수행합니다.':'CT: Reflection and translation are shown as geometric operations; integration uses the final overlap interval. / 반전·이동은 기하학적으로 보여 주며 최종 겹침 구간을 적분합니다.'}</p>${detailMarkup(id)}</section>`
}
function motionStage(){return motion.active?motion.phase:4}
function motionVisual(id,s){const p=motionStage(),q=motion.active?motion.progress:1;
 const shift=motion.sweepPos===null?(id==='dtflip'?s.n:s.t):motion.sweepPos;
 return {phase:p,progress:q,shift,active:motion.active,playing:motion.playing,mode:motion.mode,sweepComputed:motion.sweepComputed};
}
function motionRedraw(){const id=MODULES[lab.active].id;if(!isMotionLab(id))return;MODULES[lab.active].draw(lab.state[id]);motionUpdatePanel();if(typeof detailUpdatePanel==='function')detailUpdatePanel()}
function motionUpdatePanel(){const panel=$('motionPanel');if(!panel)return;const id=MODULES[lab.active].id,s=lab.state[id],phase=motionStage(),step=MOTION_PHASES[phase];const stages=$('motionStages');stages.innerHTML=MOTION_PHASES.map((p,i)=>`<span class="motion-stage ${i===phase?'current':i<phase?'done':''}" aria-current="${i===phase?'step':'false'}"><b>${i+1}</b> ${['Original','Flip','Shift','Multiply',id==='dtflip'?'Sum':'Integrate'][i]}</span>`).join('');
 const state=motion.mode==='sweep'?' · Sweep '+(id==='dtflip'?'n':'t')+' = '+fmt(motion.sweepPos===null?(id==='dtflip'?s.n:s.t):motion.sweepPos):'';
 const extra=phase===1?' · reflection about 0':phase===2?' · shift to '+(id==='dtflip'?'n='+s.n:'t='+fmt(s.t)+' s'):phase===3?' · '+(id==='dtflip'?'count the overlapping samples':'measure the overlap interval'):phase===4?' · '+(id==='dtflip'?'y['+s.n+']='+fmt(dval(conv(DT_X,[1,s.b,.5]),s.n)):'y('+fmt(s.t)+')='+fmt(overlap(s.A,s.B,s.t))):'';
 $('motionStatus').innerHTML=window.SSContentModel.html(`<strong>Step ${phase+1}/5 · ${step.en} / ${step.ko}</strong><span class="motion-eq">${id==='dtflip'?step.dt:step.ct}</span><small>${extra}${state}</small>`);
 $('motionPlay').textContent=motion.playing&&motion.mode==='steps'?'Ⅱ Pause / 일시정지':'▶ Play steps / 단계 재생';$('motionSweep').textContent=motion.playing&&motion.mode==='sweep'?'Ⅱ Pause sweep':'▶ Sweep '+(id==='dtflip'?'n':'t')+' / 전체 이동';$('motionPrev').disabled=motion.playing||phase===0;$('motionNext').disabled=motion.playing||phase===4;
}
function motionSetPhase(p){cancelMotion();motion.active=true;motion.phase=clamp(p,0,4);motion.progress=1;motionRedraw()}
function motionStopPlayback(){cancelMotion();motionRedraw()}
function motionPauseOther(){if(lab.timer){clearInterval(lab.timer);lab.timer=null;const b=$('play');if(b)b.textContent='Auto explore / 자동 탐색'}if(typeof stopGuidePlay==='function')stopGuidePlay()}
function motionRunSteps(){if(motion.playing){motionStopPlayback();return}motionPauseOther();cancelMotion();motion.active=true;motion.phase=0;motion.progress=1;motion.playing=true;motion.mode='steps';const run=motion.run;const durations=[650,1200,1400,850,1100];let start=null,prev=-1;
 const reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
 const tick=ts=>{if(run!==motion.run||!isMotionLab(MODULES[lab.active].id))return;if(start===null)start=ts;let elapsed=(ts-start)*motion.speed,phase=0;while(phase<durations.length-1&&elapsed>=durations[phase]){elapsed-=durations[phase];phase++}
 motion.phase=phase;motion.progress=(phase===1||phase===2)?(reduce?1:Math.min(1,elapsed/durations[phase])):1;
 if(phase!==prev||ts-motion.lastPaint>35){motionRedraw();motion.lastPaint=ts;prev=phase}
 if(phase===4&&elapsed>=durations[4]){cancelMotion();motion.phase=4;motion.progress=1;motion.active=true;motionRedraw();return}
 motion.raf=requestAnimationFrame(tick)};motion.raf=requestAnimationFrame(tick);motionUpdatePanel()}
function motionRunSweep(){if(motion.playing){motionStopPlayback();return}motionPauseOther();cancelMotion();const id=MODULES[lab.active].id,s=lab.state[id],isDT=id==='dtflip';motion.active=true;motion.phase=4;motion.progress=1;motion.playing=true;motion.mode='sweep';const run=motion.run,startVal=-1,endVal=isDT?6:7,duration=isDT?7300:9400;let start=null;
 const tick=ts=>{if(run!==motion.run||MODULES[lab.active].id!==id)return;if(start===null)start=ts;const fraction=Math.min(1,(ts-start)*motion.speed/duration),pos=startVal+(endVal-startVal)*fraction;
 if(isDT){const nearest=Math.round(pos);motion.sweepPos=pos;motion.sweepComputed=nearest;s.n=nearest;const input=$('ctl_n'),out=$('out_n');if(input)input.value=nearest;if(out)out.textContent=String(nearest)+' ';}
 else{motion.sweepPos=pos;motion.sweepComputed=pos;s.t=Number(pos.toFixed(2));const input=$('ctl_t'),out=$('out_t');if(input)input.value=s.t;if(out)out.textContent=fmt(s.t)+'  s';}
 if(ts-motion.lastPaint>40||fraction===1){motionRedraw();motion.lastPaint=ts}
 if(fraction===1){cancelMotion();motion.phase=4;motion.progress=1;motion.active=true;motionRedraw();if(typeof renderGuidedLearning==='function')renderGuidedLearning(MODULES[lab.active],s);return}
 motion.raf=requestAnimationFrame(tick)};motion.raf=requestAnimationFrame(tick);motionUpdatePanel()}
function wireMotionPanel(){if(!$('motionPanel'))return;$('motionPlay').onclick=motionRunSteps;$('motionSweep').onclick=motionRunSweep;$('motionFirst').onclick=()=>motionSetPhase(0);$('motionPrev').onclick=()=>motionSetPhase(motionStage()-1);$('motionNext').onclick=()=>motionSetPhase(motionStage()+1);$('motionReset').onclick=motionReset;$('motionSpeed').onchange=e=>{motion.speed=Number(e.target.value)||1};motionUpdatePanel();wireDetailPanel()}

// Rev3: sample-by-sample DT accumulation and real-time CT area integration.
const detail={kind:null,count:3,fraction:1,playing:false,raf:null,run:0,lastPaint:0};
function detailReset(){detail.run++;if(detail.raf!==null)cancelAnimationFrame(detail.raf);detail.raf=null;detail.playing=false;detail.kind=null;detail.count=3;detail.fraction=1;detail.lastPaint=0}
function detailPause(){detail.run++;if(detail.raf!==null)cancelAnimationFrame(detail.raf);detail.raf=null;detail.playing=false;detail.lastPaint=0}
function detailMarkup(id){
 if(id==='dtflip')return `<section class="detail-panel" id="termPanel" aria-label="Discrete convolution term-by-term accumulation"><div class="detail-head"><div><div class="overlabel">PRODUCT-BY-PRODUCT / 샘플별 곱셈과 누적합</div><h4>Build y[n] one term at a time / 한 항씩 더해 y[n] 완성</h4></div><span class="detail-pill">3 input samples</span></div><p class="detail-sub">Fix n, then evaluate k=0, 1, 2. A zero product is still a valid term to inspect. / n을 고정하고 k를 순서대로 이동하며 곱셈과 누적합을 확인하세요.</p><div class="detail-status" id="termStatus" role="status" aria-live="off"></div><div class="term-table-wrap"><table class="term-table"><thead><tr><th>k</th><th>x[k]</th><th>h[n−k]</th><th>Product</th><th>Running Σ</th></tr></thead><tbody id="termRows"></tbody></table></div><div class="detail-actions"><button type="button" id="termPlay" class="detail-primary">▶ Play products / 순차 계산</button><button type="button" id="termStart">↶ Start</button><button type="button" id="termPrev">◀ One back</button><button type="button" id="termNext">Add next ▶</button><button type="button" id="termAll">Show total / 전체 합</button></div><p class="detail-note">Gold = next product; teal = products already added. The running sum is <b>not</b> the final y[n] until all terms are included. / 금색은 다음 항, 청록색은 이미 더한 항입니다.</p></section>`;
 if(id==='ctrect')return `<section class="detail-panel" id="areaPanel" aria-label="Continuous convolution area accumulation"><div class="detail-head"><div><div class="overlabel">LIVE INTEGRATION / 면적 누적 애니메이션</div><h4>Fill the overlap area / 겹친 영역을 적분하며 채우기</h4></div><span class="detail-pill">Unit-height pulses</span></div><p class="detail-sub">Keep t fixed. Sweep the integration variable ξ from the left overlap boundary to the right. / 출력 시각 t를 고정하고 적분 상한 ξ를 이동하며 누적 면적을 확인하세요.</p><div class="detail-status" id="areaStatus" role="status" aria-live="off"></div><div class="area-slider"><label for="areaScrub">Integration progress / 적분 진행률 <output id="areaPercent">100%</output></label><input id="areaScrub" type="range" min="0" max="100" step="1" value="100" aria-label="Integration progress percentage"><div class="ends"><span>ξ = left boundary</span><span>ξ = right boundary</span></div></div><div class="detail-actions"><button type="button" id="areaPlay" class="detail-primary">▶ Fill area / 면적 채우기</button><button type="button" id="areaStart">↶ Start</button><button type="button" id="areaEnd">Show full area / 전체 면적</button></div><p class="detail-note">The purple outline is the complete product; the teal fill is only the area accumulated so far. / 보라색 윤곽은 전체 곱, 청록색 면적은 현재까지 적분한 부분입니다.</p></section>`;
 return '';
}
function dtTermData(s){const h=[1,s.b,.5];let sum=0;return DT_X.map((x,k)=>{const hv=dval(h,s.n-k),product=x*hv;sum+=product;return{k,x,h:hv,product,sum}})}
function ctAreaData(s){const lo=Math.max(0,s.t-s.B),hi=Math.min(s.A,s.t),width=Math.max(0,hi-lo);const fraction=detail.kind==='area'?detail.fraction:1;return{lo,hi,width,xi:lo+width*fraction,partial:width*fraction,fraction}}
function detailUpdatePanel(){const id=MODULES[lab.active].id,s=lab.state[id];if(id==='dtflip'&&$('termPanel')){
 const terms=dtTermData(s),active=detail.kind==='terms',count=active?detail.count:terms.length,total=terms.at(-1).sum,partial=count?terms[count-1].sum:0,idx=count<terms.length?count:null;
 $('termRows').innerHTML=window.SSContentModel.html(terms.map((t,i)=>`<tr class="${i<count?'term-done':i===idx?'term-next':'term-wait'}"><td>${t.k}</td><td>${fmt(t.x)}</td><td>${fmt(t.h)}</td><td>${i<count?fmt(t.product):i===idx?`<strong>${fmt(t.product)}</strong>`:'· · ·'}</td><td>${i<count?fmt(t.sum):'—'}</td></tr>`).join(''));
 $('termStatus').innerHTML=window.SSContentModel.html(count===terms.length?`<strong>Complete / 계산 완료</strong><span class="mathline">y[${s.n}] = ${terms.map(t=>fmt(t.product)).join(' + ')} = <b>${fmt(total)}</b></span>`:`<strong>Added ${count}/3 terms / ${count}개 항 누적</strong><span class="mathline">S<sub>${count}</sub> = ${fmt(partial)} &nbsp; · &nbsp; next: k=${idx}, ${fmt(terms[idx].x)} × ${fmt(terms[idx].h)} = <b>${fmt(terms[idx].product)}</b></span>`);
 $('termPlay').textContent=detail.playing&&active?'Ⅱ Pause products / 일시정지':'▶ Play products / 순차 계산';$('termPrev').disabled=detail.playing||count===0;$('termNext').disabled=detail.playing||count===3;
 }else if(id==='ctrect'&&$('areaPanel')){
 const a=ctAreaData(s),pct=Math.round(a.fraction*100);$('areaPercent').textContent=pct+'%';$('areaScrub').value=pct;
 $('areaStatus').innerHTML=window.SSContentModel.html(a.width>0?`<strong>ξ = ${fmt(a.xi)} s · ${pct}%</strong><span class="mathline">∫<sub>${fmt(a.lo)}</sub><sup>${fmt(a.xi)}</sup> 1 dτ = <b>${fmt(a.partial)}</b> &nbsp; / &nbsp; total y(${fmt(s.t)}) = ${fmt(a.width)}</span>`:`<strong>No overlap / 겹침 없음</strong><span class="mathline">x(τ)h(${fmt(s.t)}−τ) = 0 &nbsp; ⇒ &nbsp; y(${fmt(s.t)}) = 0</span>`);
 $('areaPlay').textContent=detail.playing&&detail.kind==='area'?'Ⅱ Pause fill / 일시정지':'▶ Fill area / 면적 채우기';
 }}
function detailPrepare(kind){motionPauseOther();cancelMotion();motion.active=true;motion.phase=4;motion.progress=1;motion.mode=null;detail.kind=kind}
function detailSetCount(n){detailPause();if(detail.kind!=='terms')detailPrepare('terms');detail.kind='terms';detail.count=clamp(n,0,3);motionRedraw()}
function detailRunTerms(){if(detail.playing&&detail.kind==='terms'){detailPause();motionRedraw();return}detailPrepare('terms');detail.count=0;detail.playing=true;const run=detail.run,duration=950;let start=null;
 const tick=ts=>{if(run!==detail.run||MODULES[lab.active].id!=='dtflip')return;if(start===null)start=ts;const elapsed=(ts-start)*motion.speed;detail.count=Math.min(3,Math.floor(elapsed/duration));if(ts-detail.lastPaint>35||detail.count===3){motionRedraw();detail.lastPaint=ts}if(detail.count===3){detailPause();motionRedraw();return}detail.raf=requestAnimationFrame(tick)};detail.raf=requestAnimationFrame(tick);motionRedraw()}
function detailSetFraction(v){detailPause();if(detail.kind!=='area')detailPrepare('area');detail.kind='area';detail.fraction=clamp(v,0,1);motionRedraw()}
function detailRunArea(){if(detail.playing&&detail.kind==='area'){detailPause();motionRedraw();return}detailPrepare('area');detail.fraction=0;detail.playing=true;const run=detail.run,duration=3300;let start=null;
 const tick=ts=>{if(run!==detail.run||MODULES[lab.active].id!=='ctrect')return;if(start===null)start=ts;detail.fraction=Math.min(1,(ts-start)*motion.speed/duration);if(ts-detail.lastPaint>35||detail.fraction===1){motionRedraw();detail.lastPaint=ts}if(detail.fraction===1){detailPause();motionRedraw();return}detail.raf=requestAnimationFrame(tick)};detail.raf=requestAnimationFrame(tick);motionRedraw()}
function wireDetailPanel(){if($('termPanel')){$('termPlay').onclick=detailRunTerms;$('termStart').onclick=()=>detailSetCount(0);$('termPrev').onclick=()=>detailSetCount((detail.kind==='terms'?detail.count:3)-1);$('termNext').onclick=()=>detailSetCount((detail.kind==='terms'?detail.count:3)+1);$('termAll').onclick=()=>detailSetCount(3)}
 if($('areaPanel')){$('areaPlay').onclick=detailRunArea;$('areaStart').onclick=()=>detailSetFraction(0);$('areaEnd').onclick=()=>detailSetFraction(1);$('areaScrub').oninput=e=>detailSetFraction(Number(e.target.value)/100)}detailUpdatePanel()}

startLab();
document.addEventListener('els-language-change',()=>{
  // Keep the existing sidebar, active section and parameter values intact.
  document.querySelectorAll('.ss-layout-sidebar nav [data-nav]').forEach((button,i)=>{
   const name=button.querySelector('.nav-name');
   if(name&&MODULES[i])name.textContent=window.SSContentModel.text(MODULES[i].short);
  });
  renderModule();
});
</script>
<script>window.addEventListener('message',function(e){if(e.source!==parent||!e.data||e.data.type!=='ss-set-theme')return;try{if(typeof updateModule==='function')updateModule();}catch(err){console.warn('Plot recolor failed',err)}});</script>
